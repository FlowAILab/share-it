<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>share-it</title>
<style>
/* Monochrome glass palette. Native app supplies vibrancy blur behind a
   transparent body; the browser fallback paints its own dark glass. */
:root {
  --ink: rgba(255,255,255,0.92); --dim: rgba(255,255,255,0.55);
  --faint: rgba(255,255,255,0.32); --hair: rgba(255,255,255,0.1);
  --fill: rgba(255,255,255,0.07); --fill-hi: rgba(255,255,255,0.14);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: transparent; }
body {
  color: var(--ink);
  font: 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  display: flex; flex-direction: column;
}
body.browser {
  background: radial-gradient(1200px 700px at 50% -10%, #23262c, #101216);
}
body.browser #panel {
  background: rgba(18, 17, 22, 0.97);
  backdrop-filter: blur(30px) saturate(1.2); -webkit-backdrop-filter: blur(28px) saturate(1.2);
  border: 1px solid var(--hair); border-radius: 16px;
  width: min(600px, 94vw); height: min(440px, 86vh); margin: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
}
/* native app: the WKWebView is transparent, so THIS is the only opaque layer —
   keep it near-solid dark so a light window/wallpaper behind can't wash it out
   (Raycast/Spotlight keep their overlay this dark). */
#panel { display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden;
  background: rgba(18, 17, 22, 0.985); }

#top { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
#q {
  flex: 1; background: none; border: none; outline: none; color: var(--ink);
  font: 300 21px -apple-system, system-ui, sans-serif; caret-color: var(--ink);
}
#q::placeholder { color: var(--faint); }
#q { border-bottom: 1px solid transparent; }
#q:focus-visible { border-image: linear-gradient(90deg, transparent, rgba(217,130,95,0.35), rgba(255,255,255,0.14), transparent) 1; border-bottom: 1px solid; box-shadow: none; }
.seg span:focus-visible, .tog:focus-visible, .iconbtn:focus-visible, .rowshare:focus-visible {
  outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.tog, .seg span { min-height: 24px; display: inline-flex; align-items: center; }
.tog .lbl { margin-left: 5px; font-size: 11px; }
.iconbtn {
  background: none; border: none; color: var(--dim); cursor: pointer; font: 13px monospace;
  padding: 4px 8px; border-radius: 7px;
}
.iconbtn:hover, .iconbtn.on { color: var(--ink); background: var(--fill); }
#hr { height: 1px; background: var(--hair); margin: 0 14px; }
#opts { padding: 0 18px 10px; }
.rowshare {
  border: none; cursor: pointer; border-radius: 8px; font: 600 11.5px -apple-system, system-ui;
  padding: 4px 0; width: 86px; flex: none; text-align: center; color: #101216; visibility: hidden;
  background: linear-gradient(110deg, rgba(255,255,255,0.95), rgba(255,255,255,0.7), rgba(255,255,255,0.95));
  background-size: 220% 100%; animation: sheen 5s ease infinite;
}
.row.sel .rowshare, .row:hover .rowshare, .rowshare:focus-visible { opacity: 1; visibility: visible; }
.rowshare:disabled { opacity: 0.6; }
.rowshare.done { background: none; color: var(--ink); border: 1px solid var(--hair); animation: none; }

#list { flex: 1; overflow-y: auto; padding: 8px 10px; }
#list::-webkit-scrollbar { width: 0; }
.row { border-radius: 10px; cursor: default; }
.row-line { display: flex; align-items: center; gap: 10px; padding: 9px 10px; min-width: 0; }
.row.sel > .row-line { background: var(--fill-hi); border-radius: 10px; }
.glyph { width: 14px; height: 14px; flex: none; color: var(--dim); }
.row[data-app="claude-code"] .glyph, #foot .c-claude { color: #d9825f; }
.row[data-app="cowork"] .glyph, #foot .c-cowork { color: #c9a2e8; }
.row[data-app="codex"] .glyph, #foot .c-codex { color: #8fb8e8; }
.row[data-app="pi"] .glyph { color: #e0b970; }
.row[data-app="opencode"] .glyph { color: #79c2b6; }
.row[data-app="goose"] .glyph { color: #b6a4e0; }
.row[data-app="continue"] .glyph { color: #77b6d8; }
.row[data-app="cline"] .glyph { color: #d89a77; }
.row[data-app="roo"] .glyph { color: #86c58c; }
.row[data-app="copilot"] .glyph { color: #9aa6b2; }
.glyph svg { width: 100%; height: 100%; display: block; }
.row .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { flex: none; font-size: 11px; color: var(--dim); }
.row .clip { flex: none; display: inline-flex; align-items: center; gap: 2px;
             font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.row .clip svg { width: 11px; height: 11px; }
.row.sel .clip, .row:hover .clip { color: var(--dim); }
.empty { color: var(--dim); text-align: center; margin-top: 80px; font-weight: 300; font-size: 14px; }
.empty .esc-hint { margin-top: 10px; font-size: 12px; color: var(--faint); }

/* expansion */
.card { margin: 2px 6px 8px 34px; padding: 10px 12px; border-left: 1px solid var(--hair);
        display: flex; flex-direction: column; gap: 10px; }
.peek { display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.5; }
.peek .msg { display: flex; gap: 8px; align-items: baseline; }
.peek .msg.u i { color: var(--faint); }
.peek .msg.a i { opacity: 0.9; }
.peek .msg.a i.p-claude { color: #d9825f; }
.peek .msg.a i.p-codex { color: #8fb8e8; }
.peek .msg.a i.p-cursor { color: var(--dim); }
.peek .msg.a span { color: var(--dim); }
.peek .msg.u span { color: var(--ink); }
.peek .msg.last span { color: var(--ink); }
.peek .gap { color: var(--faint); font-size: 11px; padding-left: 32px; line-height: 0.8; }
.peek div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: rgba(255,255,255,0.68); display: flex; gap: 8px; }
.peek div > span { overflow: hidden; text-overflow: ellipsis; }
.peek i { font-style: normal; flex: none; width: 42px; font-size: 10.5px; letter-spacing: 0.06em;
          text-transform: uppercase; color: var(--dim); padding-top: 2px; }
.peek b { color: var(--ink); font-weight: 600; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; }
.seg span { padding: 3px 10px; border-radius: 6px; font-size: 11.5px; color: var(--dim); cursor: pointer; }
.seg span.on { background: var(--fill-hi); color: var(--ink); }
.tog { font-size: 11.5px; color: var(--dim); cursor: pointer; padding: 3px 8px; border-radius: 6px; }
.tog.on { color: var(--ink); background: var(--fill); }
.tog.icon { padding: 4px 7px; display: inline-flex; align-items: center; }
.tog.icon svg { width: 13px; height: 13px; display: block; }
.grow { flex: 1; }
.share {
  border: none; cursor: pointer; color: #101216; font: 600 13px -apple-system, system-ui;
  padding: 8px 22px; border-radius: 9px;
  background: linear-gradient(110deg, rgba(255,255,255,0.95), rgba(255,255,255,0.75), rgba(255,255,255,0.95));
  background-size: 220% 100%; animation: sheen 5s ease infinite;
}
.share:hover { filter: brightness(1.06); }
.share:disabled { opacity: 0.5; animation: none; }
@keyframes sheen { 0%,100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
@media (prefers-reduced-motion: reduce) { .share, .rowshare { animation: none; } }
.linkrow { display: flex; gap: 8px; align-items: center; }
.linkrow input {
  flex: 1; background: var(--fill); border: 1px solid var(--hair); border-radius: 8px;
  color: var(--ink); font: 12px ui-monospace, Menlo, monospace; padding: 7px 10px; outline: none;
}
.warn-note { font-size: 11px; color: var(--dim); }
.cardline { font-size: 11.5px; color: var(--dim); }
#hits-head { padding: 8px 12px 2px; font-size: 10.5px; letter-spacing: 0.08em;
             text-transform: uppercase; color: var(--faint); }
.row .snip { display: block; font-size: 11.5px; color: var(--dim);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .snip b { color: var(--ink); font-weight: 600; }
.arts { gap: 5px 6px; }
.art {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  font-size: 11.5px; padding: 3px 9px; border-radius: 7px;
  border: 1px solid var(--hair); color: var(--dim);
}
.art .fico { display: inline-flex; opacity: 0.75; margin-right: 1px; }
.art .fico svg { display: block; }
kbd.ghostkey { color: var(--dim); margin-left: 4px; }
.art b { font-weight: 600; color: var(--ink); }
.art { height: 26px; }
.art.a-new { background: var(--fill); color: var(--ink); border-color: var(--faint); }
.art.a-mod { background: var(--fill); }
.art.a-ref { border-style: dashed; }
.linkrow .share-meta { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.art:hover { border-color: var(--dim); }
.art.picked { border-color: rgba(255,255,255,0.22); color: var(--ink); }
.share.small { padding: 4px 14px; font-size: 11.5px; }
.share.ghost { background: var(--fill); border: 1px solid var(--hair); color: var(--dim); animation: none; }
.share.ghost:hover { color: var(--ink); background: rgba(255,255,255,0.09); filter: none; }
.resume { font-size: 11px; color: var(--faint); }
.resume:hover { color: var(--ink); }
.openin { display: inline-flex; align-items: center; gap: 5px; }
.morechips { font-size: 11px; color: var(--faint); align-self: center; }
.row.pending-del { opacity: 0.5; }
.paysum { font-size: 11px; color: var(--faint); padding: 2px 0 0; }
.mhdr { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--faint); padding: 7px 12px 3px; }
.peekbox { border: 1px solid var(--hair); background: rgba(255,255,255,0.025);
  border-radius: 10px; padding: 8px 10px 9px; }
.chathdr { display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 6px; }
.copychip { cursor: pointer; text-transform: none; letter-spacing: 0;
  font-size: 11px; color: var(--dim); border: 1px solid var(--hair);
  border-radius: 6px; padding: 1px 7px; }
.copychip:hover { color: var(--ink); background: var(--fill); }
.copychip kbd { font-size: 10px; }
.actbtn { cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  font: 500 11.5px -apple-system, system-ui; color: var(--dim);
  background: var(--fill); border: 1px solid var(--hair); border-radius: 8px;
  padding: 4px 11px; }
.actbtn:hover { color: var(--ink); background: rgba(255,255,255,0.09); }
.actbtn .applogo { display: inline-flex; width: 12px; height: 12px; }
.art .selmark { color: #7fc97f; font-weight: 700; margin-right: 1px; }
.art:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
.morechips:hover { color: var(--ink); }
.applogo { display: inline-flex; width: 12px; height: 12px; }
.applogo svg { width: 12px; height: 12px; }

#foot {
  display: flex; gap: 14px; padding: 9px 18px; border-top: 1px solid var(--hair);
  font-size: 11px; color: var(--faint);
}
#foot .grow { flex: 1; }
#foot .brand { font-weight: 700; letter-spacing: -0.01em; color: var(--ink); opacity: 0.9; }
#foot .fdiv { position: relative; padding-left: 12px; margin-left: 8px; }
#foot .fdiv::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 1px; background: var(--hair); }
kbd { font: 10.5px ui-monospace, Menlo, monospace; color: var(--dim); }

/* shares view rows reuse .row */
.row .t a { color: inherit; text-decoration: none; }
.row .t a:hover { text-decoration: underline; text-underline-offset: 3px; }
.share-meta { font-size: 11px; color: var(--dim); }
.dead { text-decoration: line-through; opacity: 0.5; }
#menu, .menu-pop {
  position: fixed; z-index: 30; min-width: 220px; padding: 5px;
  background: rgba(20,19,25,0.98); backdrop-filter: blur(30px) saturate(1.3);
  -webkit-backdrop-filter: blur(30px) saturate(1.3);
  border: 1px solid var(--hair); border-radius: 15px; box-shadow: 0 18px 50px rgba(0,0,0,0.55);
}
#menu .mi, .menu-pop .mi { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 11px;
  border-radius: 9px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
#menu .mi kbd, .menu-pop .mi kbd { margin-left: auto; color: var(--dim); font-size: 11px; }
#menu .mi .chev { margin-left: auto; color: var(--dim); }
#menu .mi.sel, .menu-pop .mi.sel { background: var(--fill-hi); }
#menu hr, .menu-pop hr { border: none; border-top: 1px solid var(--hair); margin: 4px 6px; }
.dots { flex: none; visibility: hidden; }
.row.sel .dots, .row:hover .dots { visibility: visible; }
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(8px);
  background: var(--fill-hi); color: var(--ink); border: 1px solid var(--hair);
  padding: 7px 16px; border-radius: 9px; font-size: 12px; opacity: 0;
  transition: opacity 0.15s, transform 0.15s; pointer-events: none; z-index: 20;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div id="panel">
  <div id="top">
    <input id="q" placeholder="Search sessions…" autocomplete="off" spellcheck="false">
    <button class="iconbtn" id="btn-shares" title="shared links">↗</button>
  </div>
  <div id="opts" class="ctl"></div>
  <div id="hr"></div>
  <div id="list"></div>
  <div id="foot"></div>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if (!window.webkit?.messageHandlers?.shareit) document.body.classList.add("browser");
const nativePost = (m) => window.webkit?.messageHandlers?.shareit?.postMessage(m);
const nativeCmd = (cmd, files, extra) => {
  if (!window.webkit?.messageHandlers?.shareit) return false;
  nativePost({cmd, files, ...(extra || {})});
  return true;
};
// never alert(): modal dialogs freeze the panel (and automation). inline toast instead
function toast(msg) {
  let el = $("#toast");
  if (!el) {
    el = document.createElement("div"); el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg; el.classList.add("show");
  el.setAttribute("role", "status"); el.removeAttribute("aria-hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    el.classList.remove("show");
    el.setAttribute("aria-hidden", "true"); el.removeAttribute("role");
    setTimeout(() => { if (!el.classList.contains("show")) el.textContent = ""; }, 300);
  }, 3000);
}
function smartCopy() {
  // 1) real text selection anywhere → let the engine copy it
  const q = $("#q");
  if (document.activeElement === q && q.selectionStart !== q.selectionEnd) {
    document.execCommand("copy");
    return true;
  }
  if (window.getSelection()?.toString()) {
    document.execCommand("copy");
    return true;
  }
  if (mode !== "list") return false;
  const vis = visible();
  const s = vis.find((x) => x.path === expanded) || vis[sel];
  if (!s) return false;
  copyChat(s);   // ⌘C is always the chat; files have ⇧⌘C and their own button
  return true;
}

async function copyChat(s) {
  try {
    const d = await api("/api/copy_chat", {path: s.path, redact: opts.redact});
    const parts = [`Copied chat`, `${d.messages} messages`];
    if (d.images) parts.push(`${d.images} image${d.images > 1 ? "s" : ""}`);
    if (nativeCmd("copyRich", [], {html: d.html, markdown: d.markdown, images: []})) {
      toast(parts.join(" · "));
    } else {
      await copyText(d.markdown);
      toast("Copied chat as markdown (browser mode)");
    }
  } catch (e) { toast(e.message); }
}
window.__menuCopy = smartCopy;

/* ---------- unified action menu (⌘K · right-click · •••) ---------- */
let menu = null;  // {items, sel, s}
function closeMenu() { menu = null; $("#menu")?.remove(); $("#submenu")?.remove(); }

function menuItemsFor(s) {
  if (mode === "shares") {
    const sh = visibleShares()[sel];
    if (!sh) return [];
    const items = [
      {t: "Copy Link", k: "⌘C", run: () => { copyText(sh.url); toast("Copied link"); }},
      {t: "Copy for Agent", run: () => { copyText(
        "Continue this task from the shared session below. Preserve prior decisions, "
        + "inspect the included files and begin with the last unresolved request:\n\n" + sh.url);
        toast("Agent handoff copied"); }},
      {t: "Open", run: () => api("/api/open_url", {url: sh.url}).catch((e) => toast(e.message))},
    ];
    if (sh.provider === "hosted")
      items.push({sep: 1}, {t: "Delete Share", run: () =>
        document.querySelector(`[data-del="${CSS.escape(sh.url)}"]`)?.click()});
    return items;
  }
  const p = peekCache[s.path];
  const files = p ? [...(p.artifacts || []), ...(p.reads || [])]
                  : [...(s.art_list || []), ...(s.read_list || [])];
  const fp = files.map((f) => f.path);
  const nf = files.length;
  // what ⌘C actually carries: your selection, else the primary deliverable, else everything
  const selPaths = s._sel?.size ? [...s._sel]
    : (s._selTouched ? [] : (p?.primary?.length ? p.primary : fp));
  const nSelM = selPaths.length;
  const base = (q) => q.split("/").pop();
  const payload = nSelM === 1 ? base(selPaths[0]) : `${nSelM} files`;
  const items = [
    {hdr: "Share link"},
    {t: "Agent handoff", k: "⏎", run: () => doShare(s, "agent")},
    {t: "Reader page", run: () => doShare(s, "human")},
    {t: "Deep (reasoning)", run: () => {
      if (!localStorage.getItem("shareit-deep-warned")) {
        localStorage.setItem("shareit-deep-warned", "1");
        toast("Deep adds reasoning and detailed tool output — review before sending.");
      }
      doShare(s, "deep");
    }},
    {hdr: "Copy"},
    {t: "Chat", k: "⌘C", run: () => copyChat(s)},
    {t: "Last Answer", run: () => copyLastAnswer(s)},
  ];
  if (nf && nSelM) items.push({t: `Files (${payload})`, k: "⇧⌘C", run: () => copyFilesOnly(s, selPaths)});
  items.push({t: "Copy as…", sub: [
    {t: "Markdown file (.md)", run: () => copySession(s, "agent", [])},
    {t: "Web page (.html)", run: () => copySession(s, "human", [])},
    {t: `Bundle (chat + ${nf || 0} file${nf === 1 ? "" : "s"})`, run: () => copySession(s, null, fp)},
    {t: "Last code block only", run: () => copyLastCode(s)},
  ]});
  if (nf && nSelM < nf) items.push({t: `Choose Files… (${nf} total)`, run: () => {
    if (expanded !== s.path) toggle(s);
    s._chipsOpen = true; render();
  }});
  items.push({hdr: "This session"});
  const ot = openTargetFor(s);
  if (ot) items.push({t: `Open in ${ot}`, k: "⌥⏎", run: () => doResume(s)});
  items.push({t: "Reveal in Finder", run: () =>
    api("/api/file/reveal", {path: s.path, files: [fp[0] || s.path]})
      .then(() => toast("Revealed in Finder")).catch((e) => toast(e.message))});
  return items;
}

function copyFilesOnly(s, fp) {
  if (!nativeCmd("copyFiles", fp))
    api("/api/file/copy", {path: s.path, files: fp}).catch((e) => toast(e.message));
  toast(`Copied ${fp.length} file${fp.length > 1 ? "s" : ""} — paste anywhere`);
}

async function copyLastCode(s) {
  try {
    const d = await api("/api/last_answer?path=" + encodeURIComponent(s.path));
    if (!d.code_blocks.length) return toast("no code block in the last answer");
    await copyText(d.code_blocks[d.code_blocks.length - 1]);
    toast(d.code_blocks.length > 1 ? `copied last of ${d.code_blocks.length} code blocks` : "code block copied");
  } catch (e) { toast(e.message); }
}

async function copySession(s, modeOverride, extraFiles) {
  const m = modeOverride || opts.mode;
  try {
    const d = await api("/api/export", {path: s.path, mode: m, redact: opts.redact});
    const files = [d.file, ...(extraFiles || [])];
    if (nativeCmd("copyFiles", files)) {
      const n = extraFiles && extraFiles.length;
      toast(`Session copied · ${d.messages} messages`
        + (n ? ` · +${n} file${n > 1 ? "s" : ""}` : ""));
    } else {
      await copyText(d.file);
      toast(`Saved ${d.name} — path copied (browser mode)`);
    }
  } catch (e) { toast(e.message); }
}

function menuHTML(items, selIdx) {
  return items.map((i, idx) => i.sep ? '<hr role="separator">'
    : i.hdr ? `<div class="mhdr">${esc(i.hdr)}</div>`
    : `<div class="mi${idx === selIdx ? " sel" : ""}${i.sub ? " has-sub" : ""}" role="menuitem" tabindex="-1"`
      + ` aria-haspopup="${i.sub ? "menu" : "false"}" data-mi="${idx}">`
      + `${esc(i.t)}${i.sub ? '<span class="chev">›</span>' : i.k ? `<kbd>${i.k}</kbd>` : ""}</div>`).join("");
}

function placeMenu(el, x, y, anchorRight) {
  const r = el.getBoundingClientRect();
  let left = anchorRight ? x - r.width : x;
  left = Math.max(10, Math.min(left, innerWidth - r.width - 10));
  let top = y;
  if (top + r.height > innerHeight - 44) top = Math.max(10, y - r.height);  // flip up near footer
  el.style.left = left + "px";
  el.style.top = top + "px";
}

function visible() {
  const q = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const biggest = {};  // hide tiny resume-stub duplicates of the same conversation
  sessions.forEach((s) => { if (!s.subagent) biggest[s.title] = Math.max(biggest[s.title] || 0, s.size); });
  // codex resumes reuse the thread id — show only the newest rollout per thread
  const newestByThread = {};
  sessions.forEach((s) => {
    if (s.thread) {
      const t = s.last_used || s.mtime;
      if (!newestByThread[s.thread] || t > newestByThread[s.thread]) newestByThread[s.thread] = t;
    }
  });
  const base = sessions.filter((s) => !s.subagent &&
    !(s.size < 40000 && biggest[s.title] > s.size * 10) &&
    !(s.thread && (s.last_used || s.mtime) < newestByThread[s.thread]));
  base.forEach((s) => { s._contentOnly = false; });
  const vis = base.filter((s) =>
    q.every((w) => (s.title + " " + s.project + " " + s.app).toLowerCase().includes(w)));
  const have = new Set(vis.map((s) => s.path));
  for (const h of contentHits) {
    const s = base.find((x) => x.path === h.path);
    if (s && !have.has(s.path)) { s._snippet = h.snippet; s._contentOnly = true; vis.push(s); have.add(s.path); }
  }
  if (q.length) {  // title matches outrank content-only hits; both newest-first
    vis.sort((a, b) => (a._contentOnly ? 1 : 0) - (b._contentOnly ? 1 : 0)
      || (b.last_used || b.mtime) - (a.last_used || a.mtime));

      const hits = (await api("/api/search?q=" + encodeURIComponent(q))).results;
      if ($("#q").value.trim() !== q) return;  // stale response for an older query

  if (t.closest("#chat-copy")) return void copyChat(s);

  if (t.closest("#art-all")) {

    const all = [...(p?.artifacts || []), ...(p?.reads || [])].map((a) => a.path);
    s._selTouched = true;

  if (t.closest("#art-go")) return void shareSelectedArtifacts(s);
  if (t.closest("#art-copy")) {

    else api("/api/file/copy", {path: s.path, files})
      .then((d) => toast(`${d.count} file${d.count > 1 ? "s" : ""} on the clipboard — paste anywhere`))
      .catch((err) => toast(err.message));

  const agentBtn = t.closest("[data-agentcopy]");
  if (agentBtn) {

      + "inspect the included files and begin with the last unresolved request:\n\n"

  const openBtn = t.closest("[data-open]");
  if (openBtn) { api("/api/open_url", {url: openBtn.dataset.open}).catch((e) => toast(e.message)); return; }
  const copyBtn = t.closest("[data-copy]");
  if (copyBtn) {
    copyText(copyBtn.dataset.copy); flashCopied(s.path);
    const n = s._share?.n_files;
    toast(`Copied chat link${n ? ` · ${n} file${n > 1 ? "s" : ""}` : ""}`);
    return;
  }
  if (t.closest(".row-line")) { sel = +t.closest(".row").dataset.i; selPath = s.path; toggle(s); }
});

function cardHtml(s) {

    return h;
  };

  const bubble = (m) => `<div class="msg ${m.role === "user" ? "u" : "a"}"><i class="${m.role === "user" ? "" : roleCls}">${who(m)}</i><span>${hi(m.text)}</span></div>`;
  const head = p ? p.messages.slice(0, 3).map(bubble).join("") : "";
  const lastTxt = p && p.last && !(p.messages.slice(0, 3).some((m) => m.text === p.last)) ? p.last : "";
  const lastBlock = lastTxt ? `<div class="gap" title="conversation continues">⋯</div>

  const peek = !p ? '<div class="peekbox"><div class="peek"><div class="msg"><span class="share-meta">Loading preview…</span></div></div></div>'
    : `<div class="peekbox">${chatHdr}<div class="peek">${head + lastBlock
      || '<div class="msg"><span class="share-meta">no readable messages</span></div>'}</div></div>`;
  s._sel = s._sel || new Set();
  const chip = (a, cls) => {
    const st = (s._art || {})[a.path];
    const on = s._sel.has(a.path);
    const mark = st === "busy" ? "…" : lastCopied === a.path ? "✓" : "";
    const selmark = on ? '<b class="selmark">✓</b>' : "";

    return `<span class="art ${cls}${on ? " picked" : ""}" role="button" tabindex="0" data-art="${esc(a.path)}" title="${esc(tip)}">
      ${selmark}<span class="fico">${FILE_ICON(a.name)}</span>${esc(a.name)}${mark ? ` <b>${mark}</b>` : ""}</span>`;
  };
  const allChips = p ? [

    ...(p.artifacts || []).filter((a) => a.kind === "modified").map((a) => [a, "a-mod"]),
    ...(p.reads || []).map((a) => [a, "a-ref"]),

  const CHIP_CAP = 8;

  // primary deliverables and anything selected stay visible; the rest folds
  const front = allChips.filter(([a]) => prim.has(a.path) || s._sel.has(a.path));
  const rest = allChips.filter(([a]) => !prim.has(a.path) && !s._sel.has(a.path));
  const fold = !s._chipsOpen && (front.length ? rest.length > 0 : allChips.length > CHIP_CAP);
  const visChips = fold ? (front.length ? front : allChips.slice(0, CHIP_CAP)) : allChips;
  const groups = visChips.map(([a, cls]) => chip(a, cls));
  const hidden = allChips.length - visChips.length;
  if (fold && hidden > 0) groups.push(`<span role="button" tabindex="0" class="tog morechips" id="chips-more"

  else if (s._chipsOpen && (front.length ? rest.length > 0 : allChips.length > CHIP_CAP))
    groups.push('<span role="button" tabindex="0" class="tog morechips" id="chips-more" title="collapse the list">‹ less</span>');

  const nSel = s._sel.size;

  const arts = groups.length ? `<div class="ctl arts">${groups.join("")}

  const nPrim = prim.size || s.n_primary || 0;
  const truth = (s.n_msgs || s.n_images || nAll)
    ? `<div class="paysum">${[s.n_msgs ? `${s.n_msgs} messages` : null,

        nPrim ? `${nPrim} artifact${nPrim > 1 ? "s" : ""}` : null,
        nAll > nPrim ? `+${nAll - nPrim} other file${nAll - nPrim > 1 ? "s" : ""}` : null

  const openTarget = openTargetFor(s);

    title="reopen this session where it lives (⌥⏎)"><span class="applogo">${appLogo(s)}</span>Open in ${openTarget}</button>` : ""}
    <button class="actbtn" id="last-answer" title="copy the final assistant response">⧉ Copy last answer</button></div>`;
  const st = s._share;
  const linkGlyph = '<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 7l3.5-3.5M4 5H2.8A1.8 1.8 0 0 0 2.8 8.6H4M8 3.4h1.2a1.8 1.8 0 0 1 0 3.6H8"/></svg>';
  const link = st && st.url ? `
    ${opts.card && st.card ? `<div class="cardline">${esc(st.card)}</div>` : ""}
    <div class="linkrow"><span class="share-meta" title="link to the whole session">${linkGlyph} session</span>
      <input readonly value="${esc(st.url)}" id="lnk"${st.fresh ? ' data-fresh="1"' : ""}>
      ${expiryLabel(st)}<button class="iconbtn" data-copy="${esc(opts.card && st.card ? st.card + "\n" + st.url : st.url)}">copy</button>
      ${st.mode !== "human" ? `<button class="iconbtn" data-agentcopy="${esc(st.url)}" title="copy an instruction + link for another agent">for agent</button>` : ""}
      <button class="iconbtn" data-open="${esc(st.url)}">open</button></div>` : "";
  return `<div class="card">${peek}${arts || catNote}${truth}${link}${resume}</div>`;
}

async function fetchPeek(s) {
  try {
    peekCache[s.path] = await api("/api/peek?path=" + encodeURIComponent(s.path));
    const pk = peekCache[s.path];
    if (!s._selTouched && !(s._sel?.size) && pk.primary?.length)
      s._sel = new Set(pk.primary);
  }
  catch { peekCache[s.path] = {messages: [{role: "assistant", text: "unreadable"}], artifacts: []}; }
}

async function toggle(s) {
  if (!s) return;
  expanded = expanded === s.path ? null : s.path;
  render();
  if (expanded && !peekCache[s.path]) {
    await fetchPeek(s);
    if (expanded === s.path) render();
  }
}

async function copyLastAnswer(s) {
  try {
    const d = await api("/api/last_answer?path=" + encodeURIComponent(s.path));
    if (!d.answer) return toast("No assistant answer found");
    if (d.html && nativeCmd("copyRich", d.files || [], {html: d.html, markdown: d.answer, images: []})) {
      const bits = ["Answer copied"];
      if (d.files?.length) bits.push(`${d.files.length} file${d.files.length > 1 ? "s" : ""}`);
      if (d.code_blocks?.length) bits.push(`${d.code_blocks.length} code block${d.code_blocks.length > 1 ? "s" : ""} inside`);
      return toast(bits.join(" · "));
    }
    await copyText(d.answer);
    toast(d.code_blocks.length
      ? `Answer copied (${d.code_blocks.length} code block${d.code_blocks.length > 1 ? "s" : ""} inside)`
      : "Answer copied");
  } catch (e) { toast(e.message); }
}

function appShort(s) {
  return {"claude-code": "claude", "cowork": "claude", "codex": "codex",
          "cursor": "cursor"}[s.app] || "ai";
}
function openTargetFor(s) {
  if (s.app === "cowork") return "Claude";
  if (s.app === "codex") return "Codex";
  if (s.app === "claude-code") return "Claude Code";

async function doResume(s) {
  try {
    const d = await api("/api/resume", {path: s.path});
    if (d.app) toast("Opening in " + (d.target || "the app"));
    else if (d.launched) toast("Opened in Terminal");

async function shareSelectedArtifacts(s) {
  const files = [...s._sel];
  s._art = s._art || {};
  files.forEach((f) => { if (!s._art[f]?.url) s._art[f] = "busy"; });
  render();
  const results = await Promise.all(files.map(async (f) => {
    if (s._art[f]?.url) return s._art[f].url;
    try {
      const d = await api("/api/share/artifact", {path: s.path, file: f, expires_hours: opts.expiry});
      s._art[f] = {url: d.url, expires: d.expires};
      return d.url;
    } catch (e) { s._art[f] = null; toast(`${f.split("/").pop()}: ${e.message}`); return null; }
  }));
  const lines = files.filter((f, i) => results[i])
    .map((f, _, arr) => arr.length > 1 ? `${f.split("/").pop()}: ${s._art[f].url}` : s._art[f].url);
  if (lines.length) {
    copyText(lines.join("\n"));
    toast(`Link${lines.length > 1 ? "s" : ""} copied · ${lines.length} file${lines.length > 1 ? "s" : ""}`);
    files.forEach((f) => flashCopied(f));
    s._sel.clear();
    s._share = null;  // session-link file set changed with the selection
  }
  render();
}

async function doShareArtifact(s, file) {
  s._art = s._art || {};
  const st = s._art[file];
  if (st === "busy") return;
  if (st && st.url) { copyText(st.url); flashCopied(file); return; }
  s._art[file] = "busy"; render();
  try {
    const d = await api("/api/share/artifact", {path: s.path, file, expires_hours: opts.expiry});
    s._art[file] = {url: d.url, provider: d.provider, expires: d.expires};
    copyText(d.url);
    flashCopied(file);
    return;
  } catch (e) { s._art[file] = null; toast(e.message); }
  render();
}

async function doShare(s, modeOverride) {
  if (!s || s._share === "busy") return;
  const wantMode = modeOverride || opts.mode;
  // #9: a cached link is only reusable if it was built for THIS mode + files
  if (s._share?.url && !modeOverride && s._share.mode === wantMode && !s._selTouched) {
    copyText(s._share.url);
    const n = s._share.n_files;
    toast(`Copied chat link${n ? ` · ${n} file${n > 1 ? "s" : ""}` : ""}`);
    return;
  }
  s._share = "busy"; render();
  const gen = optsGen;
  try {
    // #8: only override mode defaults when the user actually picked files
    const selFiles = (peekCache[s.path] && s._selTouched) ? [...(s._sel || [])] : undefined;
    const d = await api("/api/share", {path: s.path, redact: opts.redact,
      mode: modeOverride || opts.mode, expires_hours: opts.expiry,
      ...(selFiles ? {files: selFiles} : {})});
    if (gen !== optsGen) { s._share = null; render(); return; }  // options changed mid-flight
    s._share = {url: d.url, provider: d.provider, expires: d.expires, card: d.card,
                n_files: d.n_files || 0, mode: wantMode, fresh: true};
    copyText(opts.card && d.card ? `${d.card}\n${d.url}` : d.url);
    toast(`Copied chat link${d.n_files ? ` · ${d.n_files} file${d.n_files > 1 ? "s" : ""}` : ""}`);
    flashCopied(s.path);
    if (expanded !== s.path) toggle(s);  // reveal the link row
    return;
  } catch (e) {
    s._share = null; if (gen === optsGen) toast(e.message);
  }
  render();
}

async function refresh() {
  try {
    Object.keys(peekCache).forEach((k) => {  // pending catalogues may be done now
      if (peekCache[k]?.pending) delete peekCache[k];
    });
    const data = await api("/api/sessions");
    const keep = new Map(sessions.map((s) => [s.path, s]));
    sessions = data.sessions.map((n) => {
      const old = keep.get(n.path);
      if (old && old.mtime !== n.mtime) delete peekCache[n.path];  // transcript grew — preview is stale
      return old && old.mtime === n.mtime ? Object.assign(n, {_share: old._share, _art: old._art, _sel: old._sel, _selTouched: old._selTouched, _chipsOpen: old._chipsOpen}) : n;
    });
    stores = data.stores || [];
    if (expanded && !peekCache[expanded]) {  // invalidated above — refetch live
      const cur = sessions.find((x) => x.path === expanded);
      if (cur) fetchPeek(cur).then(render);
    }
    render();
  } catch {}
}

const pendingDeletes = {};
function visibleShares() {
  const q = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const isGone = (s) => s.deleted
    || (s.expires != null && (s.expires - Date.now()/1000) <= 0);
  return shares.filter((s) => !isGone(s)
    && (sharesFilter === "all"
        || (sharesFilter === "files" && s.artifact)
        || (sharesFilter === "chats" && !s.artifact)
        || (sharesFilter === "expiring" && s.expires != null))
    && q.every((w) => (s.title + " " + s.url).toLowerCase().includes(w)));
}

function renderShares() {
  const list = $("#list");
  const live = visibleShares();
  if (sel >= live.length) sel = Math.max(0, live.length - 1);
  const nGone = shares.length - shares.filter((s) => !s.deleted
    && (s.expires == null || s.expires - Date.now()/1000 > 0)).length;
  // one row per live link — selection index == render index, and every link
  // (including per-file artifact links) is individually visible + deletable
  const expLabel = (s) => {
    if (s.expires == null) return "no expiry";
    const d = (s.expires - Date.now()/1000) / 86400;
    if (d < 1) return "expires in " + Math.max(1, Math.round(d * 24)) + "h";
    if (d < 1.5) return "expires tomorrow";
    return "expires in " + Math.round(d) + "d";
  };
  list.innerHTML = live.length ? live.map((s, i) => {
    const canDelete = s.provider === "hosted";
    const pending = !!pendingDeletes[s.url];
    const meta = `${s.artifact ? "file" : ({msgs:"human",full:"agent",chat:"human"}[s.mode]||s.mode||"chat")}`
      + ` · ${expLabel(s)}` + (s.redacted ? "" : " · RAW") + (s.provider !== "hosted" ? " · legacy" : "");
    const del = pending
      ? `<button class="iconbtn" data-undo="${esc(s.url)}" aria-label="keep link">undo</button>`
      : canDelete ? `<button class="iconbtn" data-del="${esc(s.url)}" aria-label="delete link">delete</button>`
      : `<button class="iconbtn" disabled title="legacy backend — expires on its own">·</button>`;
    return `<div class="row${i === sel ? " sel" : ""}${pending ? " pending-del" : ""}" data-i="${i}">
      <div class="row-line">
        <span class="t"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></span>
        <span class="share-meta">${meta}</span>
        <button class="iconbtn" data-copy="${esc(s.url)}" aria-label="copy link">copy</button>
        <button class="iconbtn" data-openlink="${esc(s.url)}">open</button>
        ${del}
      </div></div>`;
  }).join("") : '<div class="empty">no live links</div>';
  $("#foot").innerHTML = `<span>${live.length} live${nGone ? ` · ${nGone} expired hidden` : ""}</span>
    <span class="grow"></span><span><kbd>⏎</kbd>/<kbd>⌘C</kbd> copy · <kbd>esc</kbd> back</span>`;
}

async function sharesClick(ev) {
  const a = ev.target.closest(".row .t a");
  if (a) { ev.preventDefault(); api("/api/open_url", {url: a.href}).catch((e) => toast(e.message)); return; }
  const ob = ev.target.closest("[data-openlink]");
  if (ob) { api("/api/open_url", {url: ob.dataset.openlink}).catch((e) => toast(e.message)); return; }
  const copyBtn = ev.target.closest("[data-copy]");
  if (copyBtn) {
    copyText(copyBtn.dataset.copy); copyBtn.textContent = "✓";
    setTimeout(() => { copyBtn.textContent = "copy"; }, 900);
    return;
  }
  const undoBtn = ev.target.closest("[data-undo]");
  if (undoBtn) {
    clearTimeout(pendingDeletes[undoBtn.dataset.undo]);
    delete pendingDeletes[undoBtn.dataset.undo];
    toast("kept"); render();
    return;
  }
  const delBtn = ev.target.closest("[data-del]");
  if (delBtn) {
    const url = delBtn.dataset.del;
    pendingDeletes[url] = setTimeout(async () => {  // 5s undo window before it's real
      delete pendingDeletes[url];
      try { await api("/api/share/delete", {url}); await loadShares(); }
      catch (e) { toast(e.message); }
      render();
    }, 5000);
    toast("deleting in 5s — press undo to keep");
    render();
  }
}

async function loadShares() { shares = (await api("/api/shares")).shares; }

  $("#btn-shares").classList.toggle("on", mode === "shares");
  $("#q").value = ""; $("#q").placeholder = mode === "shares" ? "Search shared links…" : "Search sessions…";
  if (mode === "shares") await loadShares();
  sel = 0; renderOpts(); render();
});

document.addEventListener("keydown", (e) => {
  if (menu) {  // menu is the topmost layer
    const sub = $("#submenu");
    if (sub && menu.sub) {
      const items = menu.sub.items;
      if (e.key === "Escape" || e.key === "ArrowLeft") { e.preventDefault(); sub.remove(); menu.sub = null; return; }
      if (e.key === "ArrowDown") { e.preventDefault(); menu.sub.sel = Math.min(menu.sub.sel + 1, items.length - 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); menu.sub.sel = Math.max(menu.sub.sel - 1, 0); }
      else if (e.key === "Enter") { e.preventDefault(); const it = items[menu.sub.sel]; closeMenu(); it.run(); return; }
      sub.querySelectorAll(".mi").forEach((el) => el.classList.toggle("sel", +el.dataset.mi === menu.sub.sel));
      return;
    }
    const sels = menu.items.map((it, i) => (it.hdr || it.sep) ? null : i).filter((i) => i !== null);
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const cur = sels.indexOf(menu.sel);
      menu.sel = sels[Math.min(Math.max(cur + (e.key === "ArrowDown" ? 1 : -1), 0), sels.length - 1)];
      syncMenuSel();
      return;
    }
    if (e.key === "ArrowRight" && menu.items[menu.sel]?.sub) {
      e.preventDefault();
      openSub(menu.items[menu.sel], document.querySelector(`#menu [data-mi="${menu.sel}"]`));
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      const it = menu.items[menu.sel]; if (!it) return;
      if (it.sub) { openSub(it, document.querySelector(`#menu [data-mi="${menu.sel}"]`)); return; }
      closeMenu(); it.run();
      return;
    }
    return;
  }
  if (e.key === "Escape" && qlOpen) {  // next layer: Quick Look
    e.preventDefault();
    nativeCmd("closeQuickLook", []);
    qlOpen = false;
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {  // ⌘K: actions
    e.preventDefault();
    if (mode === "shares") { openMenu(null, innerWidth / 2 - 115, 160); return; }
    const vis = visible();
    const s = vis[sel];
    if (s) {
      const row = document.querySelector(`.row[data-i="${sel}"]`);
      const r = row?.getBoundingClientRect();
      openMenu(s, r ? r.right : innerWidth / 2 + 130, r ? r.bottom + 4 : 160, true);
    }
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".seg span, .tog, .copychip, .morechips, .art")) {
    e.preventDefault(); e.target.click(); return;
  }
  if (mode === "shares") {
    const live = visibleShares();
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, live.length - 1); e.preventDefault(); render(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); e.preventDefault(); render(); }
    else if (e.key === "Enter" || ((e.metaKey || e.ctrlKey) && e.key === "c"
             && !window.getSelection()?.toString())) {
      e.preventDefault();
      const s = live[sel];
      if (s) { copyText(s.url); toast("Copied link"); }
    } else if (e.key === "Escape") {
      e.preventDefault();
      if ($("#q").value) { $("#q").value = ""; render(); }
      else {
        mode = "list"; $("#btn-shares").classList.remove("on");
        $("#q").placeholder = "Search sessions…";
        renderOpts(); render();
      }
    } else if (!e.metaKey && !e.ctrlKey && e.key.length === 1) $("#q").focus();
    return;
  }
  const vis = visible();
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key === "c" && mode === "list") {
    if (smartCopy()) e.preventDefault();
    return;
  }
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, vis.length - 1); selPath = vis[sel]?.path; e.preventDefault(); render(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); selPath = vis[sel]?.path; e.preventDefault(); render(); }
  else if (e.key === "Enter" && mode === "list") {
    e.preventDefault();  // otherwise the search input beeps
    const s = vis[sel];
    if (e.altKey) { if (s && openTargetFor(s)) doResume(s); }
    else doShare(s);  // ⏎ is always session+files; files-only lives on its own button
  }
  else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "c"
           && mode === "list") {
    e.preventDefault();
    const s = vis[sel];
    if (!s) return;
    const p = peekCache[s.path];
    if (s._selTouched && !s._sel?.size) return void toast("No files selected");
    const files = s._sel?.size ? [...s._sel]
      : p?.primary?.length ? p.primary
      : [...(s.art_list || []), ...(s.read_list || [])].map((f) => f.path);
    if (files.length) copyFilesOnly(s, files);
    else copyLastAnswer(s);
  }
  else if (e.key === "ArrowRight" && mode === "list") { toggle(vis[sel]); e.preventDefault(); }
  else if (e.key === "Escape") {
    e.preventDefault();  // no system beep
    if (expanded) { expanded = null; render(); }
    else if (mode === "shares") { mode = "list"; $("#btn-shares").classList.remove("on"); render(); }
    else if ($("#q").value) { $("#q").value = ""; contentHits = []; render(); }
    else { closeMenu(); nativePost("hide"); }
  } else if (!e.metaKey && !e.ctrlKey && e.key.length === 1) $("#q").focus();
});

(async () => {
  try { sessions = (await api("/api/sessions")).sessions; }
  catch (e) { $("#list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  renderOpts();
  render();
  $("#q").focus();
})();
window.addEventListener("focus", () => { $("#q").focus(); refresh(); });
window.addEventListener("blur", closeMenu);  // panel hidden → menu must not linger
</script>
</body>
</html>
