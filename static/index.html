<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>share-it</title>
<style>
/* Monochrome glass palette. Native app supplies vibrancy blur behind a
   transparent body; the browser fallback paints its own dark glass. */
:root {
  --ink: rgba(255,255,255,0.92); --dim: rgba(255,255,255,0.68);
  --faint: rgba(255,255,255,0.5); --hair: rgba(255,255,255,0.1);
  --fill: rgba(255,255,255,0.07); --fill-hi: rgba(255,255,255,0.14);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: transparent; }
body {
  color: var(--ink);
  font: 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  display: flex; flex-direction: column;
}
body.browser {
  background: radial-gradient(1200px 700px at 50% -10%, #23262c, #101216);
}
body.browser #panel {
  background: rgba(16, 16, 20, 0.985);
  backdrop-filter: blur(30px) saturate(1.2); -webkit-backdrop-filter: blur(28px) saturate(1.2);
  border: 1px solid var(--hair); border-radius: 18px;
  width: min(620px, 94vw); height: min(460px, 86vh); margin: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
}
/* native app: the WKWebView is transparent, so THIS is the only opaque layer —
   keep it near-solid dark so a light window/wallpaper behind can't wash it out
   (Raycast/Spotlight keep their overlay this dark). */
#panel { display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden;
  position: relative;
  background: rgba(16, 16, 20, 0.92); }

#top { display: flex; align-items: center; gap: 10px; padding: 14px 18px 12px; flex: none; }
#top .mag { flex: none; width: 16px; height: 16px; color: rgba(255,255,255,0.35); }
#top .mag svg { display: block; width: 100%; height: 100%; }
#q {
  flex: 1; background: none; border: none; outline: none; color: rgba(255,255,255,0.92);
  font: 400 20px/26px -apple-system, "SF Pro Display", system-ui, sans-serif;
  caret-color: var(--ink); min-width: 0;
}
#q::placeholder { color: rgba(255,255,255,0.38); }
#q-clear { flex: none; width: 24px; height: 24px; border: none; border-radius: 12px;
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); cursor: pointer;
  font: 13px/1 -apple-system, system-ui; display: none; align-items: center; justify-content: center; }
#q-clear:hover { background: rgba(255,255,255,0.14); color: var(--ink); }
#q-clear.show { display: inline-flex; }
.seg span:focus-visible, .tog:focus-visible, .iconbtn:focus-visible, .rowicon:focus-visible {
  outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.tog, .seg span { min-height: 24px; display: inline-flex; align-items: center; }
.tog .lbl { margin-left: 5px; font-size: 11px; }
.iconbtn {
  background: none; border: none; color: var(--dim); cursor: pointer; font: 13px monospace;
  padding: 4px 8px; border-radius: 7px;
}
.iconbtn:hover, .iconbtn.on { color: var(--ink); background: var(--fill); }
#hr { height: 1px; background: var(--hair); margin: 0 14px; }
#opts { padding: 0 18px 10px; }
/* row accessory overlay — never in normal flow, never reserves space */
.acc-icons { display: none; align-items: center; gap: 2px; }
.row.sel .acc-icons, .row-line:hover .acc-icons { display: inline-flex; }
/* pill stays; idle-meta swaps to accessory icons on hover (see .meta-idle) */
.acc { gap: 4px; }
.rowicon { width: 28px; height: 28px; border: none; border-radius: 8px; cursor: pointer;
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.78); display: inline-flex;
  align-items: center; justify-content: center; padding: 0;
  transition: background 0.12s ease-out, color 0.12s, transform 0.12s; }
.rowicon svg { width: 15px; height: 15px; display: block; }
.rowicon:hover { background: rgba(255,255,255,0.16); color: #fff; transform: scale(1.07); }
/* Copy context IS the product — it reads as the lit primary */
.rowicon.primary { background: rgba(255,255,255,0.92); color: #17171b; }
.rowicon.primary:hover { background: #fff; color: #000; }
.rowicon.ok { background: rgba(143,216,160,0.18); color: #8fd8a0; }
.rowicon.haslink { color: #9fc4ee; background: rgba(143,184,232,0.14); }
.acc .dots { width: 28px; height: 28px; border-radius: 8px; }

#list { flex: 1; overflow-y: auto; padding: 6px 8px; }
#list::-webkit-scrollbar { width: 0; }
.row { border-radius: 9px; cursor: default; }
.row.exp > .row-line, .row.exp.sel > .row-line { position: sticky; top: -6px; z-index: 4;
  background: #232329 !important; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
.row-line { cursor: pointer; }
.disc { flex: none; width: 8px; color: rgba(255,255,255,0.35); font-size: 10px;
  transition: transform 0.12s; }
.row.exp .disc { transform: rotate(90deg); }
.row-line { position: relative; display: flex; align-items: center; gap: 10px;
  min-height: 40px; padding: 0 10px; min-width: 0; border-radius: 9px;
  --acc-bg: transparent; }
.row-line:hover { background: rgba(255,255,255,0.055); --acc-bg: #26262b; }
.row.sel > .row-line { background: rgba(255,255,255,0.09);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); --acc-bg: #2c2c31; }
.glyph { width: 14px; height: 14px; flex: none; color: var(--dim); border-radius: 5px; }
.glyph.canopen { cursor: pointer; }
.glyph.canopen:hover { transform: scale(1.25); filter: brightness(1.35); }
.glyph { transition: transform 0.12s ease-out, filter 0.12s; }
.row[data-app="claude-code"] .glyph, #foot .c-claude { color: #d9825f; }
.row[data-app="cowork"] .glyph, #foot .c-cowork { color: #c9a2e8; }
.row[data-app="codex"] .glyph, #foot .c-codex { color: #8fb8e8; }
.row[data-app="pi"] .glyph { color: #e0b970; }
.row[data-app="opencode"] .glyph { color: #79c2b6; }
.row[data-app="goose"] .glyph { color: #b6a4e0; }
.row[data-app="continue"] .glyph { color: #77b6d8; }
.row[data-app="cline"] .glyph { color: #d89a77; }
.row[data-app="roo"] .glyph { color: #86c58c; }
.row[data-app="copilot"] .glyph { color: #9aa6b2; }
.glyph svg { width: 100%; height: 100%; display: block; }
.row .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font: 500 14px/20px -apple-system, "SF Pro Text", system-ui; color: rgba(255,255,255,0.96); }
.row .m { flex: none; margin-left: auto; font-size: 12px; color: rgba(255,255,255,0.62);
  font-variant-numeric: tabular-nums; display: inline-flex; gap: 9px; align-items: center; }
.row .meta-idle { display: inline-flex; gap: 9px; align-items: center; }
.row.sel .meta-idle, .row-line:hover .meta-idle { display: none; }   /* idle meta hides; icons take its place */
.row .m .proj { color: rgba(255,255,255,0.55); }
.row .m .when { min-width: 30px; text-align: right; color: rgba(255,255,255,0.7); font-weight: 500; }
.srcf-self { opacity:.5; }
.srcf-self.on, .srcf-self:hover { opacity:1; }
.recent-tag { font: 500 9.5px ui-monospace, Menlo, monospace; letter-spacing: 0.06em;
  text-transform: uppercase; color: rgba(255,255,255,0.35);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 5px; padding: 1px 5px; }
.row .clip { flex: none; display: inline-flex; align-items: center; gap: 3px; cursor: pointer; border: 1px solid rgba(224,178,113,0.28);
             font: 600 11px/1 -apple-system, system-ui; font-variant-numeric: tabular-nums;
             color: #e0b271; background: rgba(224,178,113,0.14);
             border: 1px solid rgba(224,178,113,0.28); border-radius: 6px; padding: 2px 6px; }
.row .clip svg { width: 11px; height: 11px; }
.row:hover .clip, .row.sel .clip { color: #f0c68a; background: rgba(224,178,113,0.2); }
.row .clip:hover { background: rgba(224,178,113,0.3) !important; color: #ffd9a0 !important; }
.empty { color: var(--dim); text-align: center; margin-top: 80px; font-weight: 300; font-size: 14px; }
.empty .esc-hint { margin-top: 10px; font-size: 12px; color: var(--faint); }

/* expansion */
.card { margin: 2px 8px 8px 34px; padding: 10px 12px 12px; border-radius: 12px;
        background: rgba(255,255,255,0.035);
        display: flex; flex-direction: column; gap: 9px; }
.peek { display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.5; }
.peek .msg { display: flex; gap: 8px; align-items: baseline; }
.peek .msg.u i { color: var(--faint); }
.peek .msg.a i { opacity: 0.9; }
.peek .msg.a i.p-claude { color: #d9825f; }
.peek .msg.a i.p-codex { color: #8fb8e8; }
.peek .msg.a i.p-cursor { color: var(--dim); }
.peek .msg.a span { color: var(--dim); }
.peek .msg.u span { color: var(--ink); }
.peek .msg.last span { color: var(--ink); }
.peek .gap { color: var(--faint); font-size: 11px; padding-left: 32px; line-height: 0.8; }
.peek div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: rgba(255,255,255,0.68); display: flex; gap: 8px; }
.peek div > span { overflow: hidden; text-overflow: ellipsis; }
.peek i { font-style: normal; flex: none; width: 42px; font-size: 10.5px; letter-spacing: 0.06em;
          text-transform: uppercase; color: var(--dim); padding-top: 2px; }
.peek b { color: var(--ink); font-weight: 600; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; }
.seg span { padding: 3px 10px; border-radius: 6px; font-size: 11.5px; color: var(--dim); cursor: pointer; }
.seg span.on { background: var(--fill-hi); color: var(--ink); }
.tog { font-size: 11.5px; color: var(--dim); cursor: pointer; padding: 3px 8px; border-radius: 6px; }
.tog.on { color: var(--ink); background: var(--fill); }
.tog.icon { padding: 4px 7px; display: inline-flex; align-items: center; }
.tog.icon svg { width: 13px; height: 13px; display: block; }
.grow { flex: 1; }
.share {
  border: none; cursor: pointer; color: #101216; font: 600 13px -apple-system, system-ui;
  padding: 8px 22px; border-radius: 9px;
  background: linear-gradient(110deg, rgba(255,255,255,0.95), rgba(255,255,255,0.75), rgba(255,255,255,0.95));
  background-size: 220% 100%; animation: sheen 5s ease infinite;
}
.share:hover { filter: brightness(1.06); }
.share:disabled { opacity: 0.5; animation: none; }
@keyframes sheen { 0%,100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
@media (prefers-reduced-motion: reduce) { .share { animation: none; } }
.linkrow { display: flex; gap: 8px; align-items: center; }
.linkrow input {
  flex: 1; background: var(--fill); border: 1px solid var(--hair); border-radius: 8px;
  color: var(--ink); font: 12px ui-monospace, Menlo, monospace; padding: 7px 10px; outline: none;
}
.warn-note { font-size: 11px; color: var(--dim); }
.cardline { font-size: 11.5px; color: var(--dim); }
#hits-head { padding: 8px 12px 2px; font-size: 10.5px; letter-spacing: 0.08em;
             text-transform: uppercase; color: var(--faint); }
.row .snip { display: block; font-size: 11.5px; color: var(--dim);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .snip b { color: var(--ink); font-weight: 600; }
.arts { gap: 5px 6px; }
.art {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11.5px; border-radius: 7px;
  border: 1px solid var(--hair); color: var(--dim); overflow: hidden;
  transition: border-color 0.12s ease, background 0.12s ease,
              transform 0.12s ease, box-shadow 0.12s ease;
}
.art:hover { border-color: rgba(255,255,255,0.24); background: rgba(255,255,255,0.06);
  transform: translateY(-1px); box-shadow: 0 3px 12px rgba(0,0,0,0.35); }
@media (prefers-reduced-motion: reduce) { .art { transition: none; } .art:hover { transform: none; } }
.art .artbody { background: none; border: none; color: inherit; cursor: pointer;
  font: inherit; display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 4px; }
.art .artbody:hover { color: var(--ink); }
.art .chk:focus-visible, .art .artbody:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.art .fico { display: inline-flex; opacity: 0.75; margin-right: 1px; }
.art .fico svg { display: block; }
kbd.ghostkey { color: var(--dim); margin-left: 4px; }
.art b { font-weight: 600; color: var(--ink); }
.art { height: 26px; }
.art.a-new { background: var(--fill); color: var(--ink); border-color: var(--faint); }
.art.a-mod { background: var(--fill); }
.art.a-ref { border-style: dashed; }
.linkrow .share-meta { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.art:hover { border-color: var(--dim); }
.art.picked { border-color: rgba(255,255,255,0.22); color: var(--ink); }
.share.small { padding: 4px 14px; font-size: 11.5px; }
.share.ghost { background: var(--fill); border: 1px solid var(--hair); color: var(--dim); animation: none; }
.share.ghost:hover { color: var(--ink); background: rgba(255,255,255,0.09); filter: none; }
.rvbtn.on { color: #6ea8fe; opacity: 1; }
.rvbtn.on.working { animation: rvpulse 1s ease-in-out infinite; }
@keyframes rvpulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
/* row state: amber pulsing = an agent is mid-turn, green = done and unread */
.glyph.st-working, .glyph.st-done { border-radius:99px; }
.glyph.st-working { box-shadow:0 0 0 1.6px rgba(240,180,41,.9), 0 0 9px rgba(240,180,41,.3);
  animation: glyphLive 1.9s ease-in-out infinite; }
.glyph.st-done { box-shadow:0 0 0 1.6px rgba(67,197,158,.95), 0 0 8px rgba(67,197,158,.28); }
@keyframes glyphLive {
  0%,100% { box-shadow:0 0 0 1.6px rgba(240,180,41,.9), 0 0 4px rgba(240,180,41,.22); }
  50%     { box-shadow:0 0 0 1.6px rgba(240,180,41,1), 0 0 13px rgba(240,180,41,.6); } }
/* one-line source chips with the app's own mark */
.srcf-app { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.srcf-g { display:inline-flex; width:12px; height:12px; opacity:.85; }
.srcf-g svg { width:100%; height:100%; }
.srcf-app b { font-weight:600; opacity:.72; font-variant-numeric:tabular-nums; }
.live-dot.working { background:#f0b429; box-shadow:0 0 0 0 rgba(240,180,41,.6);
  animation: liveGlow 1.6s ease-out infinite; }
.live-dot.done { background:#43c59e; box-shadow:0 0 7px rgba(67,197,158,.75); }
@keyframes liveGlow {
  0% { box-shadow:0 0 0 0 rgba(240,180,41,.55); }
  70% { box-shadow:0 0 0 6px rgba(240,180,41,0); }
  100% { box-shadow:0 0 0 0 rgba(240,180,41,0); } }
/* the reviewer's mark is a lens that sweeps while it reads */
.rvdot { display:inline-flex; width:13px; height:13px; color:#6ea8fe;
  margin-right:7px; vertical-align:middle; }
.rvdot svg { width:100%; height:100%; }
.lens-btn svg, .rvdot svg { overflow:visible; }
.rvdot.working .lens, .rvbtn.working .lens { animation: lensSweep 2.2s ease-in-out infinite;
  transform-origin:7px 7px; }
.rvdot.working, .rvbtn.working { animation: lensBlip 1.4s ease-in-out infinite; }
@keyframes lensBlip { 0%,100% { opacity:.45 } 50% { opacity:1 } }
@keyframes lensSweep {   /* a small orbit, so it reads as scanning */
  0%   { transform:translate(-1.3px,-1.1px) }
  25%  { transform:translate(1.3px,-1.1px) }
  50%  { transform:translate(1.5px,1.2px) }
  75%  { transform:translate(-1.2px,1.2px) }
  100% { transform:translate(-1.3px,-1.1px) } }

.rvchip { white-space: nowrap; } .rvchip .dot { animation: rvpulse 2.4s ease-in-out infinite; }
.rvchip.has .dot { background: #e0b252; }
.rv-wrap { padding:14px 16px 20px; overflow-y:auto; letter-spacing:-.05px; }
.rv-top { display:flex; align-items:center; gap:7px; font-size:13px; margin-bottom:14px; }
.rv-arrow { color: var(--faint); }
.rv-ttl { color: var(--faint); margin-left:4px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; max-width:300px; }
.rv-live-dot { width:7px; height:7px; border-radius:99px; background:#43c59e; flex:none;
  animation: rvpulse 2.6s ease-in-out infinite; }
.rv-live-dot.busy { background:#6ea8fe; animation: rvpulse .9s ease-in-out infinite; }
.rv-stop { background:none; border:1px solid var(--line,#262b36); color:var(--faint);
  border-radius:99px; padding:2px 10px; font-size:11px; cursor:pointer; }
.rv-stop:hover { color: var(--ink); }
/* form controls do not inherit the page typeface on their own, so every button
   and input in this panel was rendering in the UA default (Arial) */
.rv-wrap button, .rv-wrap input, .rv-wrap textarea { font-family: inherit; }
/* --- mood ------------------------------------------------------------
   Simple data, so the design is typographic rather than chart-led: one
   statement, one segmented bar per agent (the macOS storage-bar idea), and
   the user's own words at a size that lands. No legend, no axes, no pie. */
.md-wrap { padding:12px 20px 10px; overflow:hidden; letter-spacing:-.05px;
  height:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; }
.md-top { display:flex; align-items:center; gap:14px; flex:none; }
.md-eyebrow { font-size:10.5px; letter-spacing:.7px; text-transform:uppercase;
  color:var(--faint); flex:none; }
.md-busy { font-size:11px; color:#6ea8fe; animation: rvpulse 1.4s ease-in-out infinite; }
/* two panels left, quotes right, filling the panel exactly once */
.md-stage { display:flex; gap:14px; align-items:stretch; flex:1; min-height:0; }
.md-left { flex:none; width:198px; display:flex; flex-direction:column; gap:10px; }
.md-score { flex:none; position:relative; overflow:hidden; display:flex;
  flex-direction:column; align-items:flex-start; gap:0;
  padding:10px 15px 9px; border-radius:14px;
  border:1px solid var(--line,#262b36); background:rgba(255,255,255,.03); }
.md-score::before { content:""; position:absolute; left:30%; top:-30%; width:80%; height:130%;
  background:radial-gradient(closest-side, var(--glow, transparent), transparent 70%);
  pointer-events:none; }
.md-score > * { position:relative; }
.md-face-xl { font-size:22px; line-height:1; margin-bottom:4px; }
.md-score-n { font-size:42px; font-weight:700; letter-spacing:-1.6px;
  line-height:1; font-variant-numeric:tabular-nums;
  font-family:ui-rounded, "SF Pro Rounded", "SF Pro Display", -apple-system, sans-serif; }
.md-score-w { font-size:13px; color:var(--dim); margin-top:2px;
  font-weight:600; letter-spacing:-.1px;
  font-family:ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }
.md-score-c { font-size:9.5px; color:var(--faint); margin-top:8px; line-height:1.35;
  letter-spacing:.4px; text-transform:uppercase; }
.md-score.s-calm { --glow:rgba(67,197,158,.16); }
.md-score.s-mixed { --glow:rgba(91,127,168,.18); }
.md-score.s-frustrated { --glow:rgba(240,180,41,.15); }
.md-score.s-angry { --glow:rgba(194,56,79,.2); }
.md-score.s-calm .md-score-n { color:#7fe0bd; text-shadow:0 0 22px rgba(67,197,158,.42); }
.md-score.s-mixed .md-score-n { color:#8fb0d8; text-shadow:0 0 22px rgba(143,176,216,.4); }
.md-score.s-frustrated .md-score-n { color:#f0b429; text-shadow:0 0 22px rgba(240,180,41,.4); }
.md-score.s-angry .md-score-n { color:#e2687f; text-shadow:0 0 22px rgba(226,104,127,.45); }
/* per agent: strict grid, bar spans underneath — nothing can escape the box */
.md-panel { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column;
  border:1px solid var(--line,#262b36);
  border-radius:14px; padding:2px 13px 6px; background:rgba(255,255,255,.02); }
.md-rows { flex:none; min-height:0; }
.md-mini-c { font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums;
  letter-spacing:.2px; }
.md-mini.thin .md-mini-s, .md-mini.thin .md-mini-bar i { opacity:.55; }
.md-mini { display:grid; grid-template-columns:14px minmax(0,1fr) auto auto;
  align-items:center; gap:4px 8px; padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.05); }
.md-mini:last-child { border-bottom:0; }
.md-mini .rvg { width:14px; height:14px; opacity:.9; }
.md-mini-n { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  font-size:12.5px; font-weight:600; }
.md-mini-s { font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;
  letter-spacing:-.3px;
  font-family:ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }
.md-mini-bar { grid-column:1 / -1; height:5px; border-radius:99px;
  background:rgba(255,255,255,.07); overflow:hidden;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.35); }
.md-mini-bar i { display:block; height:100%; border-radius:99px;

// never alert(): modal dialogs freeze the panel (and automation). inline toast instead
function toast(msg) {
  let el = $("#toast");
  if (!el) {
    el = document.createElement("div"); el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg; el.classList.add("show");
  el.setAttribute("role", "status"); el.removeAttribute("aria-hidden");
  clearTimeout(toast._t);
  const isErr = /fail|error|invalid|no longer|interrupted|unauthor/i.test(msg);
  toast._t = setTimeout(() => {
    el.classList.remove("show");
    el.setAttribute("aria-hidden", "true"); el.removeAttribute("role");
    setTimeout(() => { if (!el.classList.contains("show")) el.textContent = ""; }, 300);
  }, isErr ? 4000 : 2000);
}
function smartCopy() {
  // 1) real text selection anywhere → let the engine copy it
  const q = $("#q");
  if (document.activeElement === q && q.selectionStart !== q.selectionEnd) {
    document.execCommand("copy");
    return true;
  }
  if (window.getSelection()?.toString()) {
    document.execCommand("copy");
    return true;
  }
  if (mode !== "list") return false;
  const vis = visible();
  const s = vis[sel] || vis.find((x) => x.path === expanded);
  if (!s) return false;
  copyContext(s);   // ⌘C targets the SELECTED row, exactly like ⏎
  return true;
}

/* Copy context — the local agent-handoff verb. Builds an immutable bundle on
   disk; the clipboard gets TEXT ONLY (inline markdown when small, else a
   handoff prompt + path). localOnly: private text + host-only paths must not
   ride Universal Clipboard. */
async function copyContext(s) {
  if (!s) return;
  try {
    const d = await api("/api/copy_context", {path: s.path, deep: opts.deep});
    const ackP = nativeCmdAck("copyText", [], {text: d.text, localOnly: true});
    if (ackP) {
      if (ackFailed(await ackP)) return toast("Clipboard write failed — try again");
    } else {
      if (!(await copyText(d.text))) return;
    }
    const bits = [d.kind === "pointer" ? "Context copied (bundle pointer)" : "Context copied",
                  `${d.messages} messages`];
    if (d.images) bits.push(`${d.images} image${d.images > 1 ? "s" : ""}`);
    if (d.images_skipped) bits.push(`${d.images_skipped} unavailable`);
    if (opts.deep) bits.push("deep");
    toast(bits.join(" · "));
    flashCopied(s.path);
  } catch (e) { toast(e.message); }
}

/* Send result — the human verb. macOS won't let one ⌘V deliver BOTH text and
   files to a compose box: a text flavor on the clipboard makes chat/mail paste
   the text and ignore the files (the Pavlov trap). So the two are split:
     ⌘R  → the deliverable files ALONE, so ⌘V actually attaches them anywhere.
     ⌥⌘R → the write-up as text, for the message box.
   With no files to send, ⌘R falls back to the write-up. */
async function sendResult(s, textOnly) {
  try {
    const explicit = s._selTouched ? [...(s._sel || [])] : undefined;
    const d = await api("/api/result", {path: s.path,
      ...(textOnly ? {message_only: true}
                   : (explicit !== undefined ? {files: explicit} : {}))});
    const files = d.files || [];

    if (textOnly || files.length === 0) {   // the write-up, as text
      const ackP = nativeCmdAck("copyRich", [], {html: d.html, markdown: d.answer, images: []});
      if (ackP) {
        if (ackFailed(await ackP)) return toast("Clipboard write failed — try again");
      } else if (!(await copyText(d.answer))) return;
      toast(textOnly || files.length === 0
        ? "Write-up copied — paste as your message"
        : "Write-up copied");
      flashCopied(s.path);
      return;
    }

    // ⌘R — the files must ATTACH, so send them alone (no competing text flavor)
    const ackP = nativeCmdAck("copyFiles", files);
    if (ackP) {
      if (ackFailed(await ackP)) return toast("Clipboard write failed — try again");
    } else {
      try {
        const r = await api("/api/file/copy", {path: s.path, files});
        if (!r.ok) return toast("Clipboard write failed — try again");
      } catch (e) { return toast(e.message); }
    }
    const n = files.length;
    let msg = `${n} file${n > 1 ? "s" : ""} ready — ⌘V attaches ${n > 1 ? "them" : "it"} · ⌥⌘R for the write-up`;
    if (d.skipped?.length) msg += ` · ${d.skipped.length} missing skipped`;
    toast(msg);
    flashCopied(s.path);
  } catch (e) { toast(e.message); }
}

function placeMenu(el, x, y, anchorRight) {
  const r = el.getBoundingClientRect();
  let left = anchorRight ? x - r.width : x;
  left = Math.max(10, Math.min(left, innerWidth - r.width - 10));
  let top = y;
  if (top + r.height > innerHeight - 44) top = Math.max(10, y - r.height);  // flip up near footer
  el.style.left = left + "px";
  el.style.top = top + "px";

function openMenu(s, x, y, anchorRight, itemsOverride) {
  const opener = document.activeElement;

  if (!items.length) return;
  menu = {items, sel: items.findIndex((i) => !i.sep && !i.hdr && !i.fhdr), s, sub: null};
  const el = document.createElement("div");
  el.id = "menu"; el.setAttribute("role", "menu"); el.tabIndex = -1;
  el.innerHTML = menuHTML(items, menu.sel);
  document.body.appendChild(el);
  placeMenu(el, x, y, anchorRight);
  el.querySelector(".mi.sel")?.focus?.();
  el.addEventListener("mouseover", (ev) => {
    const mi = ev.target.closest("[data-mi]");
    if (mi) { menu.sel = +mi.dataset.mi; syncMenuSel(); }

  el.addEventListener("click", (ev) => {
    const mi = ev.target.closest("[data-mi]");

  menu.sub = {items: item.sub, sel: 0};

  const w = el.getBoundingClientRect().width;

        : `<div class="empty">No sessions match “${esc(query)}”<div class="esc-hint"><kbd>Esc</kbd> clear search</div></div>`)
      : '<div class="empty">No sessions found</div>');
  const counts = {};
  let nSelf = 0;
  sessions.filter((s) => !s.subagent).forEach((s) =>
    isSelf(s) ? nSelf++ : counts[s.app] = (counts[s.app] || 0) + 1);
  const footClass = {"claude-code": "c-claude", "cowork": "c-cowork", "codex": "c-codex"};
  const footName = {"claude-code": "claude"};
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const top = Object.entries(counts)
    .filter(([, n]) => n >= Math.max(3, total * 0.01))
    .sort(([, a], [, b]) => b - a).slice(0, 3);
  const chips = [`<span class="srcf srcf-app${srcFilter === "all" ? " on" : ""}" data-src="all" role="button" tabindex="0">All<b>${total}</b></span>`]
    .concat(top.map(([app, n]) =>
      `<span class="srcf srcf-app${srcFilter === app ? " on" : ""} ${footClass[app] || ""}" data-src="${esc(app)}" role="button" tabindex="0"><i class="srcf-g">${GLYPHS[app] || GLYPHS._fallback}</i>${footName[app] || app}<b>${n}</b></span>`))
    .concat(nSelf ? [`<span class="srcf srcf-app srcf-self${srcFilter === "_self" ? " on" : ""}" data-src="_self" role="button" tabindex="0" data-tip="share-it's own reviewer and mood agents — hidden from the list">⚙<b>${nSelf}</b></span>`] : [])
    .join("");
  const nvis = vis.length;
  $("#foot").innerHTML = `${navChips()}<span class="foot-sep"></span>${chips}<span class="grow"></span><span id="hint">${
    !vis.length && query ? `<kbd>Esc</kbd> clear`
    : query ? `${nvis} result${nvis === 1 ? "" : "s"}${IS_NATIVE ? ` · <kbd>⏎</kbd> Copy context` : ""}`
    : IS_NATIVE ? `<kbd>→</kbd> Preview · <kbd>⏎</kbd> Copy context · <kbd>⌘K</kbd> Actions` : `click a row to preview · hover for actions`}</span>`;
  $("#foot").querySelectorAll("[data-src]").forEach((el) => el.addEventListener("click", () => {
    srcFilter = (srcFilter === el.dataset.src) ? "all" : el.dataset.src;
    sel = 0; selPath = null; refreshPins(); render();
  }));
  const lnk = list.querySelector("#lnk[data-fresh]");
  if (lnk) {  // highlight once, right after creation — not on every re-render
    lnk.select();
    const s = visible().find((x) => x.path === expanded);
    if (s?._share) delete s._share.fresh;
  }
  list.scrollTop = keepScroll;
  const cur = list.querySelector(".row.sel");
  if (cur && _wantScroll) cur.scrollIntoView({block: "nearest"});
  _wantScroll = false;
  scrollToFilesIfWanted();
}

/* --- mood: how the sessions actually felt, judged by a model --- */
let MOOD = null, _moodPoll = null, _moodDrawn = false, _moodOpen = false, _moodChip = null;
const MOODS = [["calm", "calm", "🙂"], ["mixed", "mixed", "😐"],
               ["frustrated", "frustrated", "😤"], ["angry", "had enough", "🤬"]];
const MOOD_ICON = Object.fromEntries(MOODS.map(([k, , e]) => [k, e]));
const AGENT_NAME = {"claude-code": "Claude", "codex": "Codex", "cursor": "Cursor",
  "copilot": "Copilot", "cline": "Cline", "roo": "Roo", "goose": "Goose",
  "opencode": "OpenCode", "continue": "Continue", "pi": "Pi", "cowork": "Cowork"};
const clean = (t) => String(t || "")
  .replace(/^\s*\[(Image|Pasted text|Request)[^\]]*\]\s*/i, "").trim();

function navChips() {
  const waiting = REVIEWS.filter((w) => w.pending && !w.pending.sent_at).length;
  return `<span class="srcf${mode === "list" ? " on" : ""}" data-src="all"
      role="button" tabindex="0">sessions</span>
    <span class="srcf rvchip${mode === "reviews" ? " on" : ""}${waiting ? " has" : ""}${
      rvBusy() ? " live" : ""}" data-rvopen="1" role="button" tabindex="0"><span class="dot"></span>reviews${
      waiting ? " " + waiting : ""}</span>
    <span class="srcf${mode === "mood" ? " on" : ""}" data-moodopen="1"
      role="button" tabindex="0">mood</span>`;
}

function moodChip() {
  return `<span class="srcf${mode === "mood" ? " on" : ""}" data-moodopen="1"
    role="button" tabindex="0">mood</span>`;
}

let _moodErr = null;
async function loadMood() {
  try { MOOD = await api("/api/sentiment"); _moodErr = null; }
  catch (e) { _moodErr = String(e.message || e); }
  if (mode === "mood") render();
}

/* Today's number is worthless if nothing re-reads today's sessions. On opening
   the tab, quietly read a batch if anything has changed and the last read was
   a while ago. One call, not a loop. */
let _autoReadAt = 0;
function autoRead() {
  if (!MOOD || MOOD.running || !MOOD.pending) return;
  if (Date.now() - _autoReadAt < 3 * 60 * 1000) return;
  _autoReadAt = Date.now();
  api("/api/sentiment/refresh", {batches: 3})
    .then(() => { clearInterval(_moodPoll);
      _moodPoll = setInterval(async () => {
        await loadMood();
        if (mode !== "mood" || !(MOOD && MOOD.running)) {
          clearInterval(_moodPoll); _moodPoll = null;
        }
      }, 4000); })
    .catch(() => {});
}

function renderMood() {
  const m = MOOD;
  $("#foot").innerHTML = `${navChips()}<span class="grow"></span>
    <span id="hint">${m ? `rolling 24h · ${m.sessions_judged} session${
      m.sessions_judged === 1 ? "" : "s"} read` : ""}</span>`;
  $("#foot").querySelectorAll("[data-src],[data-rvopen],[data-moodopen]").forEach((el) =>
    el.addEventListener("click", () => {
      if (el.dataset.src) { mode = "list"; saveView(); }
      else if (el.dataset.rvopen) { mode = "reviews"; saveView(); }
      render();
    }));

  if (!m) {
    $("#list").innerHTML = _moodErr
      ? `<div class="md-wrap"><div class="md-blocker"><b>Can't reach share-it.</b>
         <span>${esc(_moodErr)}</span>
         <button class="md-read" data-mood="retry">try again</button></div></div>`
      : `<div class="md-wrap"><div class="rv-skel">${"<i></i>".repeat(3)}</div></div>`;
    $("#list").querySelectorAll("[data-mood]").forEach((el) =>
      el.addEventListener("click", () => loadMood()));
    return;
  }

  const agents = (m.agents || []).filter((a) => a.n);
  const named = (a) => AGENT_NAME[a.app] || a.app;
  const top = [...agents].sort((x, y) => y.frustration - x.frustration)[0];
  const rest = agents.filter((a) => a !== top);

  // Counts of sessions, not an invented 0-100 score. One cell per session,
  // oldest left — the same shape as a contribution graph, which needs no
  // explaining. Colour is the only encoding, and the key names each colour.
  const firstDraw = !_moodDrawn; _moodDrawn = true;   // animate on entry, not on poll
  // One number, said once. Everything else is evidence for it, and none of it
  // asks you to do arithmetic.
  // A mood is not an average. Dividing rough messages by the day's total let
  // a calm afternoon cancel a furious morning, which is why 56 fights out of
  // 263 messages once read as "Blissful". Rough messages now cost outright:
  // the score decays against how much friction there was, not what fraction
  // of the day it occupied. Recent friction weighs most, so the number falls
  // hard when it goes wrong and climbs back as the bad stretch ages out.
  const WEIGHT = {calm: 0.35, mixed: 0.5, frustrated: 0.85, angry: 1.25};
  const HALF_LIFE_H = 8;    // friction is worth half as much eight hours later
  const DECAY_K = 20;       // ~10 angry messages just now ≈ 54; ~40 ≈ 13
  // A run carries per-local-day message counts. Scoped to today we use only
  // today's share of it — a session you opened today may hold a fortnight of
  // history, and counting all of it is how five messages read as 176.
  const TODAY = (() => { const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${
      String(d.getDate()).padStart(2, "0")}`; })();
  const todayMsgs = (r) => ((r.days || {})[TODAY]) || 0;
  // One score per calendar day, from the per-day message buckets. There is
  // deliberately no recency decay any more: today's runs carry a file mtime of
  // "now" so they decayed by ~1, while a past day's runs decayed against that
  // day's end — which quietly discounted history and made every today look
  // worse than every yesterday. Same formula both sides, or the comparison
  // means nothing.
  const tally = (runs, dayKey) => {
    let pen = 0, n = 0;
    (runs || []).forEach((r) => {
      const msgs = dayKey ? ((r.days || {})[dayKey] || 0) : (r.msgs || 0);
      if (!msgs) return;
      n += msgs;
      // only this day's share of a session's friction
      const share = dayKey ? Math.min(1, msgs / Math.max(1, r.msgs || 1)) : 1;
      // a rough message in a "calm" session is still a rough message - the old
      // table scored it zero, so those vanished entirely
      pen += (r.rough_msgs || 0) * share * (WEIGHT[r.mood] ?? 0.6);
    });
    return {pen, n};
  };
  const dayScore = (runs, dayKey) => {
    const {pen, n} = tally(runs, dayKey);
    return n ? Math.max(0, Math.min(100, Math.round(100 * Math.exp(-pen / DECAY_K)))) : null;
  };
  const friction = (runs) => dayScore(runs, live ? TODAY : null);
  // The day turns over at YOUR midnight, not 24 hours after whenever you
  // last looked. A run counts as today only if you actually sent something
  // today, which the per-day buckets answer exactly.
  const MIDNIGHT = new Date().setHours(0, 0, 0, 0) / 1000;
  const isNow = (r) => todayMsgs(r) > 0;
  const allRuns = agents.flatMap((a) => a.runs || []);
  const dayRuns = allRuns.filter(isNow);
  const live = dayRuns.length >= 1;
  const scopeRuns = live ? dayRuns : allRuns;
  const scopeLabel = live ? "today" : `last ${m.window_days} days`;
  const score = friction(scopeRuns);
  const msgsOf = (r) => (live ? todayMsgs(r) : (r.msgs || 0));
  const roughOf = (r) => (live
    ? (r.rough_msgs || 0) * Math.min(1, todayMsgs(r) / Math.max(1, r.msgs || 1))
    : (r.rough_msgs || 0));
  const totals = scopeRuns.reduce((t, r) => ({
    msgs: t.msgs + msgsOf(r), rough: t.rough + roughOf(r)}), {msgs: 0, rough: 0});
  totals.rough = Math.round(totals.rough);
  const scoped = agents.map((a) => {
    const runs = (a.runs || []).filter((r) => !live || isNow(r));
    return {...a, runs, msgs: runs.reduce((t, r) => t + msgsOf(r), 0),
            rough_msgs: Math.round(runs.reduce((t, r) => t + roughOf(r), 0))};
  }).filter((a) => a.runs.length);
  const worst = [...scoped].sort((x, y) => (y.rough_msgs || 0) - (x.rough_msgs || 0))[0];
  const TIERS = [[93, "Flowing", "😌", "s-calm"], [76, "Good run", "🙂", "s-calm"],
                 [55, "Grinding", "😐", "s-mixed"], [30, "Rough", "😤", "s-frustrated"],
                 [0, "Brutal", "🤬", "s-angry"]];
  const tier = TIERS.find(([floor]) => (score ?? 100) >= floor) || TIERS[TIERS.length - 1];

  if (!agents.length) {
    $("#list").innerHTML = `<div class="md-wrap md-anim"><div class="md-empty">
      <img class="md-art" src="/static/mood-empty.svg" alt="">
      <h1 class="md-hero">How did your week go?</h1>
      <p class="md-sub">Nothing read yet. ${m.pending == null ? "Your" : m.pending}
        sessions from the last ${m.window_days} days are waiting — one model call per ten.</p>
      <button class="md-read" data-mood="read">read my sessions</button></div></div>`;
    bindMood();
    return;
  }

  // the receipts: one thing that went right, one that did not, side by side
  // recent and punchy beats merely worst — and never the same session twice
  const chipFor = (q, i) => {
    const open = _moodChip === (q.key || i);
    return `<div class="md-chip ${q.kind} ${open ? "open" : ""}">
      <button class="md-chip-b" data-mood="chip" data-k="${esc(q.key || String(i))}">
        <span class="md-chip-i">${q.kind === "good" ? "✅" : MOOD_ICON[q.mood] || "😤"}</span>
        <span class="md-chip-t">${esc(clean(q.quote).length > 74
          ? clean(q.quote).slice(0, 72).trimEnd() + "…" : clean(q.quote))}</span>
        ${open ? "" : `<span class="md-chip-w">${(q.tags || []).length
          ? (q.tags || []).slice(0, 3).map((t) =>
              `<b class="md-tag ${q.kind}">${esc(t)}</b>`).join("")
          : esc(q.why || "")}<em>${esc(q.agent)}</em></span>`}
      </button>
      ${open ? `<div class="md-chip-x">
        ${(q.tags || []).length ? `<div class="md-tags">${(q.tags || [])
          .map((t) => `<b class="md-tag ${q.kind}">${esc(t)}</b>`).join("")}</div>` : ""}
        <p>${esc(q.why || "no reason recorded")}</p>
        <div class="md-chip-meta">${esc(q.agent)}${q.title
          ? " · " + esc(clean(q.title).slice(0, 44)) : ""}${q.msgs ? ` · ${q.msgs} messages` : ""}${
          q.mtime ? " · " + esc(ago(new Date(q.mtime * 1000).toISOString())) : ""}
          <button class="md-open" data-mood="jump" data-title="${esc(clean(q.title || ""))}"
            title="open this session">open ›</button></div>
      </div>` : ""}
    </div>`;
  };
  // A quote belongs to the day it was SAID. Filtering on the session file's
  // mtime kept a line from Aug 19 on screen because a background pass had
  // touched the file today.
  const recent = (arr) => {
    const r = arr.filter((q) => todayMsgs(q) > 0);
    if (r.length) return r;
    const byFile = arr.filter((q) => (q.mtime || 0) >= MIDNIGHT && !(q.days));
    return byFile.length ? byFile : arr;
  };
  const winList = recent(agents.flatMap((a) => (a.wins || [])
    .map((q) => ({...q, agent: named(a)}))))
    .sort((x, y) => (y.mtime || 0) - (x.mtime || 0));
  const badList = recent(agents.flatMap((a) => (a.quotes || [])
    .map((q) => ({...q, agent: named(a)}))).filter((q) => (q.frustration || 0) >= 40))
    .sort((x, y) => (y.mtime || 0) - (x.mtime || 0));

  // Empty buckets are gaps, not zeros — a quiet hour is not a bad hour.
  const DAY = 86400000, HR = 3600000;
  const STEP = live ? 2 * HR : DAY;
  const NBUCK = live ? 12 : m.window_days;
  // buckets end on the current hour when live, on today when not
  const END = live ? Math.ceil(Date.now() / (2 * HR)) * 2 * HR
                   : new Date().setHours(0, 0, 0, 0) + DAY;
  const buckets = Array.from({length: NBUCK}, () => ({msgs: 0, rough: 0}));
  agents.forEach((a) => (a.runs || []).forEach((r) => {
    if (!r.mtime) return;
    const i = NBUCK - 1 - Math.floor((END - r.mtime * 1000) / STEP);
    if (i >= 0 && i < NBUCK) {
      buckets[i].msgs += r.msgs || 0; buckets[i].rough += r.rough_msgs || 0;
    }
  }));
  const days = buckets.map((b) => b.msgs
    ? {score: Math.max(0, 100 - Math.round((b.rough / b.msgs) * 100)), msgs: b.msgs} : null);
  const bucketLabel = (k) => {
    const end = new Date(END - (NBUCK - 1 - k) * STEP);
    return live
      ? new Date(end - STEP).toLocaleTimeString([], {hour: "numeric"}).replace(" ", "")
        + "–" + end.toLocaleTimeString([], {hour: "numeric"}).replace(" ", "")
      : new Date(end - DAY).toLocaleDateString([], {weekday: "short", day: "numeric", month: "short"});
  };
  const trend = `<div class="md-trend">
    <div class="md-trend-h">${live ? "last 24h" : m.window_days + " days"}<span class="grow"></span>${
      (() => { const seen = days.filter(Boolean);
        if (seen.length < 2) return live ? "one stretch so far" : "not enough days yet";
        const half = Math.ceil(seen.length / 2);
        const avg = (xs) => Math.round(xs.reduce((t, d) => t + d.score, 0) / xs.length);
        const delta = avg(seen.slice(half)) - avg(seen.slice(0, half));
        return delta === 0 ? "holding steady"
          : `${delta > 0 ? "▲" : "▼"} ${Math.abs(delta)} vs earlier`; })()}</div>
    <div class="md-spark" data-spark>${days.map((d, i) => {
      const dayOf = bucketLabel;
      if (!d) return `<i class="gap" data-d="${esc(dayOf(i))}" data-t="quiet"></i>`;
      const t = TIERS.find(([f]) => d.score >= f) || TIERS[TIERS.length - 1];
      return `<i class="${t[3]}" style="height:${Math.max(9, d.score)}%"
        data-d="${esc(dayOf(i))}" data-t="${d.score} · ${d.msgs} msg${
          d.msgs === 1 ? "" : "s"}"></i>`;
    }).join("")}</div><div class="md-tip" hidden></div></div>`;

  // today against the fortnight behind it — the one comparison the data supports
  // Every earlier day scored the same way as today, then averaged. Bucketing
  // by the session FILE's mtime used to drop a whole day's messages out of the
  // baseline whenever a background pass touched that file today.
  const priorDays = [...new Set(allRuns.flatMap((r) => Object.keys(r.days || {})))]
    .filter((k) => k !== TODAY).sort();
  const usual = (() => {
    const scores = priorDays.map((k) => dayScore(allRuns, k)).filter((x) => x != null);
    return scores.length
      ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  })();
  const versus = (() => {
    if (usual == null || score == null) return "";
    const d = score - usual;
    const bar = (v, lab, on) => {
      const t = TIERS.find(([f]) => v >= f) || TIERS[TIERS.length - 1];
      return `<div class="md-vs-r${on ? " now" : ""}">
        <span class="md-vs-l">${lab}</span>
        <span class="md-mini-bar"><i class="${on ? t[3] : "s-past"}-f"
          style="width:${Math.max(4, v)}%"></i></span>
        <span class="md-vs-n${on ? " " + t[3] + "-t" : ""}">${v}</span></div>`;
    };
    return `<div class="md-vs">
      <div class="md-trend-h">${scopeLabel}<span class="grow"></span>${d === 0
        ? "same as usual" : `${d > 0 ? "▲" : "▼"} ${Math.abs(d)} vs usual`}</div>
      ${bar(score, "now", true)}${bar(usual, "usual", false)}</div>`;
  })();

  const rows = scoped.map((a) => {
    const sc = friction(a.runs) ?? 100;
    const t = TIERS.find(([f]) => sc >= f) || TIERS[TIERS.length - 1];
    // 100 out of four messages is not the same claim as 100 out of eighty —
    // show the sample beside the score instead of hiding it in a tooltip
    const thin = a.msgs < 10;
    return `<div class="md-mini${thin ? " thin" : ""}" title="${sc} out of 100 — ${
      a.rough_msgs || 0} of ${a.msgs} messages were a fight${
      thin ? " (too few to read much into)" : ""}">
      <span class="rvg">${GLYPHS[a.app] || GLYPHS._fallback}</span>
      <span class="md-mini-n">${esc(named(a))}</span>
      <span class="md-mini-c">${a.msgs} msg${a.msgs === 1 ? "" : "s"}</span>
      <span class="md-mini-s ${t[3]}-t">${sc}</span>
      <span class="md-mini-bar"><i class="${t[3]}-f"
        style="width:${Math.max(4, sc)}%"></i></span>
    </div>`;
  }).join("");

  $("#list").innerHTML = `<div class="md-wrap${firstDraw ? " md-anim" : ""}">
    ${m.error ? `<div class="md-blocker warn"><b>Part of that run failed.</b>
      <span>${esc(m.error)}</span></div>` : ""}
    <div class="md-top"><span class="md-eyebrow">${scopeLabel}${
      totals.msgs ? ` · ${totals.msgs} msg${totals.msgs === 1 ? "" : "s"}` : ""}</span>
      <span class="grow"></span>
      ${m.running ? `<span class="md-busy">reading… ${m.sessions_judged} done${
          m.pending ? `, ${m.pending} to go` : ""}</span>`
        : `<button class="md-read" data-mood="read">read ${
            m.pending == null ? "20" : Math.min(20, m.pending)} more</button>`}
    </div>

    <div class="md-stage">
      <div class="md-left">
        <div class="md-score ${tier[3]}">
          <span class="md-face-xl">${tier[2]}</span>
          <span class="md-score-n">${score}</span>
          <span class="md-score-w">${tier[1]}</span>
          <span class="md-score-c">${totals.msgs
          ? `${totals.rough} of ${totals.msgs} messages were a fight${
              live ? "" : " · " + scopeLabel}`
          : "nothing yet " + scopeLabel}</span>
        </div>
        <div class="md-panel"><div class="md-rows">${rows}</div>${
          live ? versus : (days.filter(Boolean).length >= 2 ? trend : "")}</div>
      </div>
      <div class="md-receipts">${(() => {
        const now = Date.now();
        const rank = (q, base) => base
          - ((now - (q.mtime || 0) * 1000) / 3600000) * 6;   // fades 6 an hour
        const pool = [
          ...winList.map((q) => ({...q, kind: "good", r: rank(q, 62 + Math.min(20, (q.msgs || 0) / 4))})),
          ...badList.map((q) => ({...q, kind: "bad", r: rank(q, q.frustration || 50)})),
        ].filter((q) => q.quote);
        // two rough, one good — balanced but honest about which dominates
        const seen = new Set(), picks = [];
        const take = (kind, max) => {
          for (const q of pool.sort((x, y) => y.r - x.r)) {
            if (q.kind !== kind) continue;
            const id = (q.title || "") + "|" + q.quote.slice(0, 24);
            if (seen.has(id)) continue;
            seen.add(id);
            picks.push({...q, key: id});
            if (picks.filter((p) => p.kind === kind).length >= max) return;
          }
        };
        take("bad", 2);
        take("good", 1);
        take("bad", 3);                              // fill the column, rough-heavy
        if (picks.length < 4) take("good", 2);
        picks.sort((x, y) => y.r - x.r);
        if (!picks.length)
          return `<div class="md-none">read a few sessions and the moments show up here</div>`;
        const good = picks.filter((q) => q.kind === "good").length;
        return picks.map(chipFor).join("") + (good ? "" :
          `<div class="md-none quiet">no good moments recorded ${
            live ? "today" : "yet"} — every quote above is friction</div>`);
      })()}</div>
    </div>



  </div>`;
  bindMood();
  bindSpark();
  fitReceipts();
  return;
}

// Quotes are whatever length they are, so no fixed padding makes four of them
// fit at every window size. Drop the weakest until the column stops scrolling.
function fitReceipts() {
  const col = $("#list").querySelector(".md-receipts");
  if (!col) return;
  for (let guard = 0; guard < 6; guard++) {
    const chips = col.querySelectorAll(".md-chip");
    if (chips.length <= 2 || col.scrollHeight <= col.clientHeight) break;

      tip.hidden = false;
      const b = bar.getBoundingClientRect(), s = spark.getBoundingClientRect();
      const x = b.left - s.left + b.width / 2;

function bindMood() {
  $("#list").querySelectorAll("[data-mood]").forEach((el) =>
    el.addEventListener("click", () => {
      const k = el.dataset.mood;
      if (k === "expand") { _moodOpen = !_moodOpen; _moodDrawn = true; return render(); }
      if (k === "retry") return loadMood();
      if (k === "chip") {                    // reveal in place, do not navigate
        const id = el.dataset.k;
        _moodChip = _moodChip === id ? null : id;
        _moodDrawn = true;
        return render();
      }
      if (k === "jump") {                    // the quote is a way back in
        const t = (el.dataset.title || "").slice(0, 40);
        if (t) { $("#q").value = t; mode = "list"; saveView(); render(); }
        return;
      }
      el.disabled = true; el.textContent = "reading…";
      api("/api/sentiment/refresh", {batches: 2})
        .then((x) => { toast(x.message); clearInterval(_moodPoll);
          _moodPoll = setInterval(async () => {          // stop when the run does
            await loadMood();
            if (mode !== "mood" || !(MOOD && MOOD.running)) {

/* Reviews tab: what the other model has said, and anything waiting on you. */
/* The reviewers panel. Many agents can be reviewing at once, so the top level
   is a list of them — one compact card each, expanded on click. */
function renderReviews() {
  if (_rvErr && !REVIEWS.length) {
    $("#list").innerHTML = `<div class="rv-wrap"><div class="rv-blank">
      <b>Cannot reach share-it</b>

    rvFoot();
    return;
  }
  if (!REVIEWS.length && !_rvLoaded) {
    $("#list").innerHTML = `<div class="rv-wrap">${
      `<div class="rvc"><div class="rv-skel" style="padding:16px">${"<i></i>".repeat(2)}</div></div>`
        .repeat(2)}</div>`;

  }
  if (!REVIEWS.length) {
    $("#list").innerHTML = `<div class="rv-wrap"><div class="rv-blank">
      <b>No reviewers running</b>
      <span>Hover a session and click the other model's mark. That model reads the
      work as it happens and speaks up only when something looks wrong.</span></div></div>`;
    rvFoot();
    return;
  }
  const ordered = orderedWatches();
  const need = REVIEWS.filter((w) => w.pending && !w.pending.sent_at);
  const banner = need.length ? `<div class="rv-alert" data-rv="jump">

  bindReviewDelegates();
  $("#list").innerHTML = `<div class="rv-wrap">${banner}${ordered.map(rvCard).join("")}</div>`;
  const pane = document.getElementById("rv-pane");
  if (pane) bindRuns(pane);
  if (_openW) {
    if (_pane === "tx" && _tx[_openW] === undefined) loadTx();
    if (_pane === "notes" && _notes[_openW] === undefined) loadNotes();
  }
  rvFoot();

  bindAskBox();
  // delegated once, not re-bound per render: a poll landing between mousedown
  // and mouseup replaced the node and silently orphaned its listener
}

let _rvDelegated = false;

  if (_rvDelegated) return;
  _rvDelegated = true;
  const list = $("#list");
  list.addEventListener("mouseenter", () => { _listHover = true; });
  list.addEventListener("mouseleave", () => { _listHover = false; render(); });

    const act = ev.target.closest("[data-rv]");
    if (act && list.contains(act)) { ev.stopPropagation(); return onReviewAction(act); }
    const card = ev.target.closest("[data-wopen]");

    const card = ev.target.closest("[data-wopen]");

function openWatch(p) {
  _openIdx = _openW === p ? -1 : _order.indexOf(p);   // hold its slot while open
  _openW = _openW === p ? null : p;
  saveView();
  render();
  if (!_openW) return;
  if (_pane === "tx") loadTx(); else loadNotes();
  // expanding the last card would otherwise leave its body below the fold
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const list = $("#list"), card = list && list.querySelector(".rvc.open");
    if (!card) return;
    const wrap = card.offsetParent || list;
    list.scrollTo({top: Math.max(0, card.offsetTop - (wrap === list ? 0 : wrap.offsetTop) - 8),

/* Rank by what you would look at first — but never reorder while the user is
   in the middle of something. A card that moves under the cursor is worse than
   a card in a stale position, so the order is frozen while a card is open, the
   pointer is inside the list, or a text box has focus. */

function orderedWatches() {
  const tier = (w) => w.paused ? 3
    : (w.pending && !w.pending.sent_at) ? 0
    : (w.busy || _queued.has(w.path)) ? 1 : 2;
  const when = (w) => (w.history[0] || {}).at || w.added || "";
  const fresh = [...REVIEWS].sort((a, b) =>
    tier(a) - tier(b) || (when(b) > when(a) ? 1 : when(b) < when(a) ? -1 : 0))
    .map((w) => w.path);
  // An open card is not "interacting" — it can stay open for an hour, and
  // freezing on it meant the list never re-sorted at all. Freeze only on
  // transient contact, and pin the open card so it alone never moves.
  const busyHands = _askOpen || _fxFocused || _listHover;
  if (!busyHands || !_order.length) {
    _order = fresh;
  } else {
    const live = new Set(REVIEWS.map((w) => w.path));
    const kept = _order.filter((p) => live.has(p));          // drop stopped ones
    for (const p of fresh) if (!kept.includes(p)) kept.push(p);   // new ones last
    _order = kept;
  }
  if (_openW && _openIdx >= 0 && _order.includes(_openW)) {
    const rest = _order.filter((p) => p !== _openW);
    const at = Math.min(_openIdx, rest.length);
    _order = [...rest.slice(0, at), _openW, ...rest.slice(at)];
  }
  return _order.map((p) => rvFor(p)).filter(Boolean);
}

/* One review inside a card: headline always, detail on demand. The one that

function rvItem(w, h, i) {

  const sev = SEV[Math.max(0, Math.min(3, h.severity || 0))];

      <span class="rvi-t">${esc(hhmm(h.at))}</span>
      <span class="rvi-title">${esc(head)}</span>
      ${hot && sev.label ? `<span class="rvi-sev s${h.severity}">${sev.label}</span>` : ""}
      ${h.sent_at ? `<span class="rvi-done"><span class="rvi-tick">${I_TICK}</span>sent</span>`
        : hot ? `<span class="rvi-tag">needs you</span>`
        : ask ? `<span class="rvi-tag calm">worth sending</span>`
        : `<span class="rvi-quiet">info</span>`}

        carried on — it is here so you can see what it looked at.
        <button class="rvi-link" data-rv="copy" data-p="${esc(w.path)}" data-i="${i}">copy anyway</button></div>`}

          data-rv="tog" data-k="${esc(key + "#n")}" data-open="${_openR.has(key + "#n") ? 1 : 0}">${_openR.has(key + "#n")

/* The one place in the panel that asks something of you. It should look like

// the scale runs 0..3 upward; nobody should have to guess that from a numeral
const SEV = [{label: ""}, {label: "note"}, {label: "fix eventually"}, {label: "fix now"}];

const I_SEND = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2 7.2 8.9M14 2l-4.4 12-2.4-5.1L2 6.5z"/></svg>';
const I_COPY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="5.4" y="5.4" width="7.6" height="7.6" rx="1.7"/><path d="M10.6 5.4V4.2a1.6 1.6 0 0 0-1.6-1.6H4.6A1.6 1.6 0 0 0 3 4.2v4.4a1.6 1.6 0 0 0 1.6 1.6h1"/></svg>';

const I_LENS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><g class="lens"><circle cx="7" cy="7" r="4.1"/><path d="M10.1 10.1 13.4 13.4"/></g></svg>';
const I_TICK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6.5"/></svg>';

    <div class="rv-acts">

        data-tip="${sent ? `Open ${esc(peer)} again` : `Copy and open ${esc(peer)}`}">

function onReviewAction(el) {

  if (k === "tog") {
    const key = el.dataset.k;
    const shown = el.dataset.open === "1";   // what is on screen, not what is in the set
    if (shown) { _openR.delete(key); _openR.add("!" + key); }
    else { _openR.add(key); _openR.delete("!" + key); }

  }
  if (k === "jump") {
    const first = REVIEWS.find((x) => x.pending && !x.pending.sent_at);
    if (first) { _openW = first.path; render(); loadTx();

        if (c) c.scrollIntoView({block: "start", behavior: "smooth"}); }); }

      .then((x) => { toast(x.message); return pollReview(); })
      .then(() => render()).catch((e) => toast(String(e.message || e)));

      .then((x) => { if (!x.ok) { _queued.delete(path); delete _queuedAt[path]; }

      .catch((e) => { _queued.delete(path); delete _queuedAt[path]; render();
                      toast(String(e.message || e)); });
  }
  if (k === "pane-tx") { _pane = "tx"; saveView(); render(); return loadTx(); }
  if (k === "pane-notes") { _pane = "notes"; saveView(); render(); return loadNotes(); }
  if (k === "copy") return api("/api/review/copy", {path, i: +el.dataset.i})
    .then((x) => toast(x.message)).catch(() => {});
  if (k === "reject") {
    return api("/api/review/reject", {path, i: +el.dataset.i})
      .then((x) => { toast(x.message); return pollReview(); })
      .then(() => render()).catch((e) => toast(String(e.message || e)));

    const kindWord = {"a-new": "created", "a-mod": "modified", "a-ref": "read (referenced)"}[cls];
    const tip = `${kindWord}${a.size != null ? ` · ${fmtSize(a.size)}` : ""} — click previews · 2× opens · right-click for more`;
    // checkbox + preview are SEPARATE focusable buttons (keyboard-usable)
    return `<span class="art ${cls}${on ? " picked" : ""}">
      <button class="chk${on ? " on" : ""}" data-chk="${esc(a.path)}" role="checkbox" aria-checked="${on}" tabindex="0" aria-label="${on ? "Deselect" : "Select"} ${esc(a.name)}" data-tip="${on ? "Remove from selection" : "Select for copy/share"}">${on ? "✓" : ""}</button>

  };

    ...(p.reads || []).map((a) => [a, "a-ref"]),

  const front = allChips.filter(([a]) => prim.has(a.path) || s._sel.has(a.path));

  const catNote = p?.pending && s.arts
    ? '<div class="ctl"><span class="share-meta">cataloguing files… (a moment, then reopen)</span></div>' : "";
  const nSel = s._sel.size;

  const selHint = nSel ? `<button class="actbtn" id="art-copy">Copy ${nSel > 1 ? nSel + " files" : "file"}${IS_NATIVE ? ' <kbd class="ghostkey">⇧⌘C</kbd>' : ""}</button><button class="actbtn" id="art-go">Share ${nSel > 1 ? "files" : "file"}</button>` : "";
  const arts = groups.length ? `<div class="ctl arts">${groups.join("")}
    ${nAll > 1 ? `<span role="button" tabindex="0" class="tog" id="art-all">${nSel === nAll ? "Clear" : "Select all"}</span>` : ""}
    ${selHint}</div>` : "";
  const openTarget = openTargetFor(s);

  // conditional link status row — only after a link exists (row 🔗 creates it)
  const st = s._share;
  const linkGlyph = '<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6.7 7l2.6-2.6"/><path d="M5.9 5.2 4.8 6.3a1.96 1.96 0 1 0 2.77 2.77l1.1-1.1"/><path d="M6.1 6.8l1.1-1.1a1.96 1.96 0 1 0-2.77-2.77L3.3 4"/></svg>';
  const link = st && st.url ? `
    <div class="linkrow"><span class="share-meta">${linkGlyph} shared</span>
      <input readonly value="${esc(st.url)}" id="lnk"${st.fresh ? ' data-fresh="1"' : ""}>
      ${expiryLabel(st)}<button class="iconbtn" data-copy="${esc(st.url)}" data-tip="Copy link">copy</button>
      <button class="iconbtn" data-open="${esc(st.url)}" data-tip="Open in browser">open</button></div>` : "";

  // ONE primary action, right-aligned: Open in <app> ▾. For resumable sessions
  // the caret's terminal entries RESUME there (and become the sticky default);
  // for others they just open the project folder.
  const stickyTerm = openTarget ? savedTerm() : "";
  const openOpts = s._openOpts ? `<div class="openopts">
    ${openTarget ? `<button class="actbtn" data-odir="app"><span class="applogo">${appLogo(s)}</span>${openTarget}</button>` : ""}
    <button class="actbtn" data-odir="finder">${I_FOLDER} Finder</button>
    ${TERMS.map((tm) => `<button class="actbtn" data-odir="${esc(tm.name)}"${openTarget ? ` data-tip="Resume here — becomes the default"` : ""}>${I_TERM} ${esc(tm.label)}${stickyTerm === tm.name ? " ✓" : ""}</button>`).join("")}
  </div>` : "";
  const footer = `<div class="cardfoot">
    <span class="foot-meta">${opts.deep ? '<span class="chip-deep" data-tip="Deep mode on|⌘D">deep</span>' : ""}</span>
    <span class="openin-wrap">
      ${openTarget
        ? `<button class="actbtn primary" id="resume" data-tip="Reopen this session${stickyTerm ? ` in ${esc(stickyTerm)}` : ""}|⌥⏎"><span class="applogo">${appLogo(s)}</span>Open in ${openTarget}</button>`
        : `<button class="actbtn primary" id="openin-caret2" data-tip="Open folder">Open ▾</button>`}
      ${openTarget ? '<button class="actbtn primary caret" id="openin-caret" data-tip="Open in…">▾</button>' : ""}
    </span>
  </div>`;
  return `<div class="card">${peek}${arts || catNote}${link}${openOpts}${footer}</div>`;
}

async function fetchPeek(s) {
  try {
    peekCache[s.path] = await api("/api/peek?path=" + encodeURIComponent(s.path));
    api("/api/chat?path=" + encodeURIComponent(s.path)).then((d) => {
      if (peekCache[s.path] && d.messages?.length) {
        peekCache[s.path].messages = d.messages;   // full transcript, clipped
        if (expanded === s.path) { render(); scrollChatEnd(); }
      }
    }).catch(() => {});
    const pk = peekCache[s.path];
    if (!s._selTouched && !(s._sel?.size) && pk.primary?.length)
      s._sel = new Set(pk.primary);
  }
  catch { peekCache[s.path] = {messages: [{role: "assistant", text: "unreadable"}], artifacts: []}; }
}

function scrollToFilesIfWanted() {
  if (!_scrollFilesFor || _scrollFilesFor !== expanded) return;   // only the intended, still-open row
  const arts = $("#list") && $("#list").querySelector(".row.exp .arts");

function setExpanded(v) {   // single gate for `expanded` — any change away drops a pending files-scroll
  if (_scrollFilesFor && _scrollFilesFor !== v) _scrollFilesFor = null;
  expanded = v;
}
function scrollChatEnd() {
  const pk = $("#list")?.querySelector(".card .peek");
  if (pk) pk.scrollTop = pk.scrollHeight;   // latest message in view, like a chat
}
async function toggle(s) {

async function doResume(s, term) {
  try {
    // explicit pick wins; otherwise a terminal-based session (Claude Code)
    // reuses the remembered choice — pick Warp once, it's Warp from then on
    const sticky = term || (openTargetFor(s) === "Claude Code" ? savedTerm() : "");
    const body = {path: s.path};
    if (sticky) body.terminal = sticky;
    if (term) body.app = false;          // explicit terminal beats the app deep link
    const d = await api("/api/resume", body);
    if (d.app) toast("Opening in " + (d.target || "the app"));
    else if (d.launched) toast(`Resumed in ${d.terminal || "Terminal"}`);
    else if (await copyText(d.command)) toast(`Command copied — paste in ${d.terminal || "your terminal"}`);
  } catch (e) { toast(e.message); }

async function shareSelectedArtifacts(s) {
  const files = [...s._sel];
  s._art = s._art || {};
  files.forEach((f) => { if (!s._art[f]?.url) s._art[f] = "busy"; });
  render();
  const results = await Promise.all(files.map(async (f) => {
    if (s._art[f]?.url) return s._art[f].url;
    try {
      const d = await api("/api/share/artifact", {path: s.path, file: f, expires_hours: opts.expiry});
      s._art[f] = {url: d.url, expires: d.expires};
      return d.url;
    } catch (e) { s._art[f] = null; toast(`${f.split("/").pop()}: ${e.message}`); return null; }
  }));
  const lines = files.filter((f, i) => results[i])
    .map((f, _, arr) => arr.length > 1 ? `${f.split("/").pop()}: ${s._art[f].url}` : s._art[f].url);
  if (lines.length) {
    if (await copyText(lines.join("\n")))
      toast(`Link${lines.length > 1 ? "s" : ""} copied · ${lines.length} file${lines.length > 1 ? "s" : ""}`);
    else return toast("Clipboard write failed — try again");
    files.forEach((f) => flashCopied(f, true));
    s._sel.clear();
    s._share = null;  // session-link file set changed with the selection
  }
  render();
}


async function doShare(s, modeOverride) {
  if (!s || s._share === "busy") return;
  const wantMode = modeOverride || (opts.deep ? "deep" : "agent");
  // #9: a cached link is only reusable if it was built for THIS mode + files
  // no client-side link reuse — the server's find_cached validates fingerprint+
  // mtime+expiry and returns the same URL when it's genuinely still good, so we
  // can never hand out a stale/expired/deleted link
  if (s._share && s._share !== "busy") s._share = null;
  s._share = "busy"; render();
  const gen = optsGen;
  try {
    // #8: only override mode defaults when the user actually picked files
    const selFiles = (peekCache[s.path] && s._selTouched) ? [...(s._sel || [])] : undefined;
    const d = await api("/api/share", {path: s.path,
      mode: wantMode, expires_hours: opts.expiry,
      ...(selFiles ? {files: selFiles} : {})});
    if (gen !== optsGen) { s._share = null; render(); return; }  // options changed mid-flight
    s._share = {url: d.url, provider: d.provider, expires: d.expires,
                n_files: d.n_files || 0, mode: wantMode, fresh: true, mtime: s.mtime};
    if (!(await copyText(d.url))) { s._share.fresh = true; render(); return toast("Link created — clipboard write failed, copy it from the row"); }
    const bits = [`Link copied`];
    if (d.n_files) bits.push(`${d.n_files} file${d.n_files > 1 ? "s" : ""}`);
    if (d.images_skipped) bits.push(`${d.images_skipped} image${d.images_skipped > 1 ? "s" : ""} unavailable`);
    toast(bits.join(" · "));
    flashCopied(s.path);   // the row's link icon turns blue — no surprise expand
    return;
  } catch (e) {
    s._share = null; if (gen === optsGen) toast(e.message);
  }
  render();
}

async function refresh() {
  try {
    Object.keys(peekCache).forEach((k) => {  // pending catalogues may be done now
      if (peekCache[k]?.pending) delete peekCache[k];
    });
    const data = await api("/api/sessions");
    const keep = new Map(sessions.map((s) => [s.path, s]));
    sessions = data.sessions.map((n) => {
      const old = keep.get(n.path);
      if (old && old.mtime !== n.mtime) delete peekCache[n.path];  // transcript grew — preview is stale
      // carry ALL ui state regardless of mtime (Quick Look / expanded shouldn't reset)
      const keepShare = (old && old._share && old._share.mtime === n.mtime) ? old._share : null;
      return old ? Object.assign(n, {_share: keepShare, _art: old._art, _sel: old._sel, _selTouched: old._selTouched, _chipsOpen: old._chipsOpen, _chatAll: old._chatAll, _openMsg: old._openMsg, _openOpts: old._openOpts}) : n;
    });
    stores = data.stores || [];
    if (expanded && !peekCache[expanded]) {  // invalidated above — refetch live
      const cur = sessions.find((x) => x.path === expanded);
      if (cur) fetchPeek(cur).then(render);
    }
    render();
  } catch {}
}

const pendingDeletes = {};
function visibleShares() {
  const q = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const isExpired = (s) => s.expires != null && (s.expires - Date.now()/1000) <= 0;
  return shares.filter((s) => !s.deleted
    && (sharesFilter === "expired" ? isExpired(s) : !isExpired(s))
    && (sharesFilter === "all" || sharesFilter === "expired"
        || (sharesFilter === "files" && s.artifact)
        || (sharesFilter === "chats" && !s.artifact)
        || (sharesFilter === "expiring" && s.expires != null))
    && q.every((w) => (s.title + " " + s.url).toLowerCase().includes(w)));
}

function renderShares() {
  const list = $("#list");
  const live = visibleShares();
  if (sel >= live.length) sel = Math.max(0, live.length - 1);
  if (sel < 0) sel = 0;
  // true expired count = non-deleted links past their expiry (matches the expired view)
  const nGone = shares.filter((s) => !s.deleted
    && s.expires != null && (s.expires - Date.now()/1000) <= 0).length;
  // one row per live link — selection index == render index, and every link
  // (including per-file artifact links) is individually visible + deletable
  const expLabel = (s) => {
    if (s.expires == null) return "no expiry";
    const d = (s.expires - Date.now()/1000) / 86400;
    if (d <= 0) return "expired";   // #9: an expired link must never read "expires in…"
    if (d < 1) return "expires in " + Math.max(1, Math.round(d * 24)) + "h";
    if (d < 1.5) return "expires tomorrow";
    return "expires in " + Math.round(d) + "d";
  };
  list.innerHTML = live.length ? live.map((s, i) => {
    const canDelete = s.provider === "hosted";
    const pending = !!pendingDeletes[s.url];
    const meta = `${s.artifact ? "file" : ({msgs:"human",full:"agent",chat:"human"}[s.mode]||s.mode||"chat")}`
      + ` · ${expLabel(s)}` + (s.redacted ? "" : " · RAW") + (s.provider !== "hosted" ? " · legacy" : "");
    const del = pending
      ? `<button class="iconbtn" data-undo="${esc(s.url)}" aria-label="keep link">undo</button>`
      : canDelete ? `<button class="iconbtn" data-del="${esc(s.url)}" aria-label="delete link">delete</button>`
      : `<button class="iconbtn" disabled title="legacy backend — expires on its own">·</button>`;
    return `<div class="row${i === sel ? " sel" : ""}${pending ? " pending-del" : ""}" role="listitem" data-i="${i}">
      <div class="row-line">
        <span class="t"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></span>
        <span class="share-meta">${meta}</span>
        <button class="iconbtn" data-copy="${esc(s.url)}" aria-label="copy link">copy</button>
        <button class="iconbtn" data-openlink="${esc(s.url)}">open</button>
        ${del}
      </div></div>`;
  }).join("") : `<div class="empty">${sharesFilter === "expired" ? "No expired links"
    : ($("#q").value ? `No shared links match “${esc($("#q").value)}”` : "No shared links yet")}</div>`;
  const selRow = list.querySelector(`.row[data-i="${sel}"]`);
  if (selRow && _wantScroll) selRow.scrollIntoView({block: "nearest"});
  _wantScroll = false;
  const label = sharesFilter === "expired" ? "expired" : "live";
  $("#foot").innerHTML = `<span>${live.length} ${label}${(sharesFilter !== "expired" && nGone) ? ` · ${nGone} expired` : ""}</span>
    <span class="grow"></span><span><kbd>⏎</kbd>/<kbd>⌘C</kbd> copy · <kbd>esc</kbd> back</span>`;
}

async function sharesClick(ev) {
  const a = ev.target.closest(".row .t a");
  if (a) { ev.preventDefault(); api("/api/open_url", {url: a.href}).catch((e) => toast(e.message)); return; }
  const ob = ev.target.closest("[data-openlink]");
  if (ob) { api("/api/open_url", {url: ob.dataset.openlink}).catch((e) => toast(e.message)); return; }
  const copyBtn = ev.target.closest("[data-copy]");
  if (copyBtn) {
    copyText(copyBtn.dataset.copy).then((ok) => { if (ok) copyBtn.textContent = "✓"; });
    setTimeout(() => { copyBtn.textContent = "copy"; }, 900);
    return;
  }
  const undoBtn = ev.target.closest("[data-undo]");
  if (undoBtn) {
    clearTimeout(pendingDeletes[undoBtn.dataset.undo]);
    delete pendingDeletes[undoBtn.dataset.undo];
    toast("kept"); render();
    return;
  }
  const delBtn = ev.target.closest("[data-del]");
  if (delBtn) {
    const url = delBtn.dataset.del;
    pendingDeletes[url] = setTimeout(async () => {  // 5s undo window before it's real
      delete pendingDeletes[url];
      try { await api("/api/share/delete", {url}); await loadShares(); }
      catch (e) { toast(e.message); }
      render();
    }, 5000);
    toast("deleting in 5s — press undo to keep");
    render();
  }
}

document.addEventListener("keydown", (e) => {
  // any other editable field owns its own keystrokes — without this the
  // catch-all below yanks focus to the search box on every character typed
  const tgt = e.target;
  if (tgt && tgt !== $("#q") &&
      (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA" || tgt.isContentEditable)) {
    if (e.key === "Escape") { tgt.blur(); }
    return;
  }
  if (menu) {  // menu is the topmost layer
    const sub = $("#submenu");
    if (sub && menu.sub) {
      const items = menu.sub.items;
      if (e.key === "Escape" || e.key === "ArrowLeft") { e.preventDefault(); sub.remove(); menu.sub = null; return; }
      if (e.key === "ArrowDown") { e.preventDefault(); menu.sub.sel = Math.min(menu.sub.sel + 1, items.length - 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); menu.sub.sel = Math.max(menu.sub.sel - 1, 0); }
      else if (e.key === "Enter") { e.preventDefault(); const it = items[menu.sub.sel]; closeMenu(); it.run(); return; }
      sub.querySelectorAll(".mi").forEach((el) => el.classList.toggle("sel", +el.dataset.mi === menu.sub.sel));
      return;
    }
    const sels = menu.items.map((it, i) => (it.hdr || it.sep || it.fhdr) ? null : i).filter((i) => i !== null);
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const cur = sels.indexOf(menu.sel);
      menu.sel = sels[Math.min(Math.max(cur + (e.key === "ArrowDown" ? 1 : -1), 0), sels.length - 1)];
      syncMenuSel();
      return;
    }
    if (e.key === "ArrowRight" && menu.items[menu.sel]?.sub) {
      e.preventDefault();
      openSub(menu.items[menu.sel], document.querySelector(`#menu [data-mi="${menu.sel}"]`));
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      const it = menu.items[menu.sel]; if (!it) return;
      if (it.sub) { openSub(it, document.querySelector(`#menu [data-mi="${menu.sel}"]`)); return; }
      closeMenu(); it.run();
      return;
    }
    return;
  }
  if (e.key === "Escape" && qlOpen) {  // next layer: Quick Look
    e.preventDefault();
    nativeCmd("closeQuickLook", []);
    qlOpen = false;
    return;
  }
  if (IS_NATIVE && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {  // ⌘K: actions
    e.preventDefault();
    if (mode === "shares") { openMenu(null, innerWidth / 2 - 115, 160); return; }
    const vis = visible();
    const s = vis[sel];
    if (s) {
      const row = document.querySelector(`.row[data-i="${sel}"]`);
      const r = row?.getBoundingClientRect();
      openMenu(s, r ? r.right : innerWidth / 2 + 130, r ? r.bottom + 4 : 160, true);
    }
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".tog, .morechips, .artbody, .chk, .srcf, .older, .clip, .glyph.canopen")) {
    e.preventDefault(); e.target.click(); return;
  }
  if (mode === "shares") {
    const live = visibleShares();
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, live.length - 1); e.preventDefault(); _wantScroll = true; render(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); e.preventDefault(); _wantScroll = true; render(); }
    else if (e.key === "Enter" || ((e.metaKey || e.ctrlKey) && e.key === "c"
             && !window.getSelection()?.toString())) {
      e.preventDefault();
      const s = live[sel];

    } else if (e.key === "Escape") {
      e.preventDefault();
      if ($("#q").value) { $("#q").value = ""; render(); }
      else {
        mode = "list"; $("#btn-shares").classList.remove("on");
        $("#q").placeholder = "Search sessions and messages…";
        renderOpts(); render();
      }
    } else if (!e.metaKey && !e.ctrlKey && e.key.length === 1) $("#q").focus();
    return;
  }
  const vis = visible();
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key === "c" && mode === "list") {
    if (smartCopy()) e.preventDefault();
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!vis.length) return;
    _navTs = Date.now();
    sel = e.key === "ArrowDown" ? Math.min(sel + 1, vis.length - 1) : Math.max(sel - 1, 0);
    selPath = vis[sel]?.path;
    moveSel(true);   // class flip + scroll only — never rebuilds the DOM
  }
  else if (e.key === "Enter" && mode === "list") {
    e.preventDefault();  // otherwise the search input beeps
    const s = vis[sel];
    if (e.altKey) { if (s && openTargetFor(s)) doResume(s); }
    else copyContext(s);   // ⏎ = the primary verb: copy context
  }
  // ⌘L/⌘R/⌘D belong to browser chrome outside the native shell — never hijack
  else if (IS_NATIVE && (e.metaKey || e.ctrlKey) && !e.shiftKey
           && e.key.toLowerCase() === "l" && mode === "list") {
    e.preventDefault();
    doShare(vis[sel]);     // ⌘L = share link
  }
  else if (IS_NATIVE && (e.metaKey || e.ctrlKey) && !e.shiftKey
           && e.key.toLowerCase() === "r" && mode === "list") {
    e.preventDefault();
    if (vis[sel]) sendResult(vis[sel], e.altKey);   // ⌘R result · ⌥⌘R message only
  }
  else if (IS_NATIVE && (e.metaKey || e.ctrlKey) && !e.shiftKey
           && e.key.toLowerCase() === "d" && mode === "list") {
    e.preventDefault();
    toggleDeep();          // ⌘D = deep toggle
  }
  else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "c"
           && mode === "list") {
    e.preventDefault();
    const s = vis[sel];
    if (!s) return;
    if (s._selTouched && !s._sel?.size) return void toast("No files selected");
    const files = selectedFilePaths(s);
    if (files.length) copyFilesOnly(s, files);
    else toast("No files in this session");
  }
  else if (e.key === "ArrowRight" && mode === "list") {
    e.preventDefault();
    if (expanded !== vis[sel]?.path) toggle(vis[sel]);   // right only goes IN
  }
  else if (e.key === "ArrowLeft" && mode === "list") {
    e.preventDefault();
    if (expanded) { setExpanded(null); _wantScroll = true; render(); }   // left goes back out
  }
  else if (e.key === "Escape") {
    e.preventDefault();  // no system beep
    if (expanded) { setExpanded(null); render(); }
    else if (mode === "shares") { mode = "list"; $("#btn-shares").classList.remove("on"); render(); }
    else if ($("#q").value) { $("#q").value = ""; $("#q-clear").classList.remove("show"); contentHits = []; render(); }
    else if (srcFilter !== "all") { srcFilter = "all"; sel = 0; render(); }
    else { closeMenu(); nativePost("hide"); }
  } else if (!e.metaKey && !e.ctrlKey && e.key.length === 1) $("#q").focus();
});

(async () => {
  api("/api/openers").then((d) => { TERMS = d.terminals || []; }).catch(() => {});
  try { sessions = (await api("/api/sessions")).sessions; }
  catch (e) { $("#list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  renderOpts();
  render();
  $("#q").focus();
})();
window.addEventListener("focus", () => {
  if (document.activeElement === document.body || document.activeElement === null)
    $("#q").focus();   // never yank focus after Quick Look / app switches
  refreshPins();       // re-pin recents for this fresh look at the palette
  refresh();
});
window.addEventListener("blur", closeMenu);  // panel hidden → menu must not linger
</script>
</body>
