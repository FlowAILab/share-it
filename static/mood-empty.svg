<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 132" role="img"
     aria-label="A grid of session squares, most unread">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <!-- the few that have been read, in mood colour -->
  <g filter="url(#soft)" opacity=".5">
    <rect x="6"  y="10" width="26" height="26" rx="8" fill="#43c59e"/>
    <rect x="40" y="44" width="26" height="26" rx="8" fill="#e0b252"/>
  </g>
  <rect x="6"   y="10" width="22" height="22" rx="7" fill="#43c59e"/>
  <rect x="34"  y="10" width="22" height="22" rx="7" fill="#5b7fa8"/>
  <rect x="62"  y="10" width="22" height="22" rx="7" fill="#5b7fa8"/>
  <rect x="40"  y="44" width="22" height="22" rx="7" fill="#e0b252"/>
  <!-- everything still unread, dissolving to the right -->
  <g fill="url(#fade)">
    <rect x="90"  y="10" width="22" height="22" rx="7"/>
    <rect x="118" y="10" width="22" height="22" rx="7"/>
    <rect x="146" y="10" width="22" height="22" rx="7"/>
    <rect x="174" y="10" width="22" height="22" rx="7"/>
    <rect x="202" y="10" width="22" height="22" rx="7"/>
    <rect x="6"   y="44" width="22" height="22" rx="7"/>
    <rect x="68"  y="44" width="22" height="22" rx="7"/>
    <rect x="96"  y="44" width="22" height="22" rx="7"/>
    <rect x="124" y="44" width="22" height="22" rx="7"/>
    <rect x="152" y="44" width="22" height="22" rx="7"/>
    <rect x="180" y="44" width="22" height="22" rx="7"/>
    <rect x="208" y="44" width="22" height="22" rx="7"/>
    <rect x="6"   y="78" width="22" height="22" rx="7"/>
    <rect x="34"  y="78" width="22" height="22" rx="7"/>
    <rect x="62"  y="78" width="22" height="22" rx="7"/>
    <rect x="90"  y="78" width="22" height="22" rx="7"/>
    <rect x="118" y="78" width="22" height="22" rx="7"/>
    <rect x="146" y="78" width="22" height="22" rx="7"/>
  </g>
</svg>
